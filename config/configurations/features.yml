# The whole MCP layer (Mcp::*): both mounts, their release, and the geo cascade. One feature rather
# than a main_config block per mount plus a separate mcp_geo_scope feature -- they are one subsystem,
# and "what does this instance need for MCP" could not be answered from a single file before.
:mcp:
  # Off means neither mount gets a route at all, so a client sees 404 rather than a server that
  # answers and then cannot work. Read while the routes are drawn: a change needs a restart.
  :enabled: false
  :mounts:
    # POST /api/mcp -- instance-wide, scoped by the calling user's api visibility (Mcp::ApiScope).
    :global:
      :enabled: false
      # Releases create_content/update_content. A second switch on purpose, so an upgrade cannot
      # slip write tools into an installation that only reads.
      :write_enabled: false
      # Browser origins allowed to call the mount. Empty means same-origin; a client that sends no
      # Origin header (every non-browser client) is unaffected by it. The allowed HOSTNAMES are NOT
      # configured here -- the transport is handed config.hosts, which ActionDispatch::HostAuthorization
      # checks before any controller runs.
      :allowed_origins: []
    # POST /api/v4/endpoints/:id/mcp -- scoped to one published StoredFilter and its facets.
    :endpoint:
      :enabled: false
      :write_enabled: false
      :allowed_origins: []
  # Instance-specific notes that BOTH mounts append to their server instructions
  # (Mcp::ServerInstructions). What belongs here is what holds for THIS installation and therefore
  # must not sit in the gem -- how a fact is modelled, say ("gastronomy exists as TouristAttraction
  # plus a category, not as FoodEstablishment"), or which classification tree carries a dimension
  # its name does not reveal.
  #
  # Maintained as a language-keyed hash; a single string applies to every language. Without an
  # entry the instructions text stays unchanged. Empty by default: after an upgrade an installation
  # must not ship someone else's statements about its data.
  :instance_notes: {}
  # Geo cascade of the MCP tools (Mcp::GeoScope). The ORDER of the stages is NOT configurable here --
  # it is fixed in Mcp::GeoScope::STAGES (classification tree, then geo_regions, then address) so an
  # LLM cannot choose it. What is configurable is only WHERE resolution happens.
  :geo:
    # On, so the standard case needs no entry here at all. An instance that does NOT seed the tree
    # named below costs nothing by it: no label is found, Mcp::GeoScope.resolve returns nil and every
    # place name answers resolved: false -- indistinguishable from this switch being off.
    #
    # Not gated like :write_enabled:, which releases side effects an upgrade must not slip in. This
    # one only decides how well a read-only place name resolves, and it is reached at all only on an
    # installation that has already switched on :enabled: and a mount.
    :enabled: true
    # Trees in which a place name is resolved to a concept. Order = priority for ambiguous names (the
    # same place name often exists in several trees). Without an entry the cascade has no effect.
    #
    # "Administrative Einheiten" is the one tree dataCycle computes itself -- data_cycle_basic's
    # administrative_unit_classifications derives it from the content's geometry. Every further tree
    # (tourism regions, marketing groups) exists under a name only the project knows.
    :resolution_trees:
      - Administrative Einheiten
    # Administrative prefixes stripped from the concept name before it is compared with
    # address.address_locality ("Gemeinde Egg" -> "Egg"), because address_locality carries the bare
    # place name. The German prefixes of the tree above; an instance whose concepts are named
    # differently replaces the list instead of extending it.
    :locality_prefixes:
      - Gemeinde
      - Marktgemeinde
      - Stadt
      - Bezirk
    # Trees whose concepts carry polygons and are matched by CONTAINMENT instead of by name -- stage
