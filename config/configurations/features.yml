# Which attribute is filled from which annotation field is declared per attribute in the template
# (:features: :image_description_pixie: :source:), so only the backend dependency is global here.
#
# The generate buttons are available wherever the feature is, and each asks for the one locale its
# editor edits. The computed ALT label (:description_generated:) runs on every save instead, and
# :generate_for: is where it is configured -- everything under that key describes the label, not the
# buttons.
#
# :dependencies: names the backend feature, but the computed label itself is not in core: the
# attribute :description_generated: and its compute module
# Datacycle::Feature::Embedding::Utility::Compute ship with the gem datacycle-feature-embedding,
# whose templates a project has to add to DataCycleCore.default_template_paths. Without that gem the
# buttons work and no computed ALT label exists. What the postfix _generated then derives -- the
# "only while the editorial field is empty" condition and the KI-Agent marking -- is documented in
# docs/generated_attributes.md.
:image_description_pixie:
  :enabled: false
  :allowed: false
  :dependencies:
    - embedding
  # :generate_for:
  #   # naming external systems restricts the label to the images of those imports and leaves
  #   # editorial uploads to the buttons. Without the key every image the attribute is on gets one.
  #   :external_sources:
  #     - canto_dam
  #   # the annotation service generates a caption, an ALT text and a title per language, each its
  #   # own vision call, so this is what one image costs. Defaults to I18n.default_locale.
  #   :languages:
  #     - de
  #     - en

