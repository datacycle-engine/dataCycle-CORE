manage_system_subjects:
  actions: manage
  segment: SubjectByConditions
  parameters:
    - - DataCycleCore::ConceptScheme
      - DataCycleCore::Concept
      - DataCycleCore::ConceptLink

# only system_admin may recompute computed attributes from the admin dashboard
# (super_admin's dash_board whitelist deliberately excludes these actions)
dash_board_computed_attributes:
  actions:
    - computed_attributes_form
    - update_computed_attributes
  segment: SubjectByConditions
  parameters:
    - - :dash_board

# only system_admin may rewrite a grafana dashboard for external sharing: step 1 of the procedure
# is an export from the internal org, and grafana.ini's org_mapping puts system_admin alone in it
dash_board_grafana_dashboard:
  actions:
    - flatten_grafana_dashboard_form
    - flatten_grafana_dashboard
  segment: SubjectByConditions
  parameters:
    - - :dash_board

# These four /api/config subjects expose the instance's own data model as configuration:
# the raw schema/feature/common config and the generated RDF schema — ontology, SHACL
# shapes and JSON-LD @context (:api_config_rdf, #50196). They stay system_admin-only.
#
# The OpenAPI document is deliberately NOT among them: it documents the API a caller is
# already entitled to use, so it carries no subject at all and every authenticated user
# reaches it (both the JSON document and its Swagger UI viewer).
#
# Anonymous access never gets this far anyway — the `authenticate` block wrapping
# `namespace :api` in config/routes.rb blocks it. This file decides the answer for
# logged-in non-admins. ':read' aliases :index and :show in CanCan.
read_api_configs:
  actions: read
  segment: SubjectByConditions
  parameters:
    - - :api_config_schema
      - :api_config_features
      - :api_config_common
      - :api_config_rdf

# the developer guides document dataCycle internals, so only system_admin gets the sidebar entry
# (#51344). Until then it hung off `can?(:home, :dash_board)`, which super_admin holds. This gates the
# menu entry, not the route: /guides sits in an `authenticate` block in config/routes.rb, but
# StaticController authorizes nothing, so any signed-in user can still open it by URL.
show_guides:
  actions: show
  segment: SubjectByConditions
  parameters:
    - - :guides

show_raw_data:
  actions: show_raw_data
  segment: SubjectByConditions
  parameters: DataCycleCore::Thing

# the external URI of a concept is a technical mapping detail (license URLs, foreign ids), so it is
# only rendered in classification tooltips for system_admin (#27657). manage_system_subjects above
# already covers this action; declaring it keeps the capability greppable, lists it in the permissions
# overview and lets a project grant it without handing out full classification management.
show_concept_uri:
  actions: show_uri
  segment: SubjectByConditions
  parameters: DataCycleCore::Concept

user_actions:
  actions: manage
  segment: SubjectByConditions
  parameters: DataCycleCore::User

role_filter:
  actions: filter
  segment: SubjectByConditions
  parameters: DataCycleCore::Role

trigger_update_webhook:
  actions: trigger_update_webhooks
  segment: SubjectByConditions
  parameters: DataCycleCore::Thing

show_webhook_error_message:
  actions: show_webhook_error_message
  segment: SubjectByConditions
  parameters: DataCycleCore::Thing

watch_list_bulk_actions:
  actions:
    - show
    - bulk_edit
    - bulk_delete
    - update
    - change_owner
    - create_api
    - update_description
    - show_description
  segment: SubjectByConditions
  parameters: DataCycleCore::WatchList
