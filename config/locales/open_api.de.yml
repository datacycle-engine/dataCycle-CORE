de:
  open_api:
    info:
      description: "Instanzspezifische OpenAPI-3.1-Beschreibung der dataCycle API v4 (Datenstrukturen, Lese- sowie Schreib-/Verwaltungs-Endpunkte)."
    schemas:
      any_entity: "Beliebige Entität der Instanz (eines der ThingTemplate-Komponentenschemata)."
      type_hierarchy: "schema.org-Typhierarchie inklusive dcls:{Template}."
      entity_type: "schema.org-Typhierarchie dieser Entität: %{types}."
      entity_reference: "Referenz-Stub einer verknüpften Entität ({ @id, @type }), wird geliefert, sofern nicht über include/fields expandiert."
      asset_reference: "Referenz auf ein Asset ({ @id }); anders als bei verknüpften Entitäten ohne @type."
      concept: "Ein SKOS-Concept (Klassifizierung), wie es die v4-API ausliefert."
      concept_scheme: "Ein SKOS-ConceptScheme (Klassifizierungsbaum), wie es die v4-API ausliefert."
      concept_scheme_has_concept: "URL des Concepts-Endpunkts dieses Schemas."
      geo_json_type: "GeoJSON-Geometrietyp, z. B. Polygon, MultiPolygon, LineString."
      geo_json_coordinates: "GeoJSON-Koordinaten-Array (Verschachtelung abhängig vom Geometrietyp)."
      schedule_duration: "ISO-8601-Dauer."
      schedule_repeat_frequency: "ISO-8601-Wiederholungsfrequenz."
      property_value_type: "PropertyValue oder QuantitativeValue."
      property_value_value_reference: "Verweis auf die Herkunft des Werts (z. B. Sync-Typ `import` bei externen Identifikatoren)."
      collection_reference_type: "z. B. [CreativeWork, Collection, dcls:{Class}]."
    filter:
      attribute: |
        Bedingung je Attribut (nach api_name).

        Jeder Wert ist eine `min`/`max`/`equals`/`like`/`bool`-Bedingung. Beispiel: `attribute[price][in][max]=100`.
      min_max: "Datum oder Datum-Uhrzeit."
      schedule_all: |
        Filtert über ALLE Schedule-Relationen.

        Ignoriert `schedule_filter_exceptions`.
      duplicate_candidates_exists: "`true` = nur Inhalte MIT Duplikatskandidaten, `false` = nur solche ohne."
      duplicate_candidates_min_score: "Mindest-Score eines Kandidaten."
      duplicate_candidates_max_score: "Höchst-Score eines Kandidaten."
      duplicate_candidates_method: "Erkennungsmethode, z.B. `manual` oder `only_title`."
      graph: |
        Verschachtelter Filter über ein verknüpftes Attribut.

        Beispiel: `filter[graph][region][dc:classification][in][withSubtree]=UUID`.
      linked: "Veraltet: stattdessen `graph` verwenden."
      union: |
        Logisches ODER über die angegebenen Teilfilter.

        Beispiel: `union: [ {search: "a"}, {search: "b"} ]`.
      geo_box: |
        Bounding-Box.

        Koordinaten `[swLon, swLat, neLon, neLat]`. Beispiel: `9.5,47.1,9.9,47.4`.
      geo_perimeter: |
        Umkreis.

        `[lon, lat, distance]` (Distanz in Metern). Beispiel: `9.53,47.13,5000`.
      geo_shape: |
        Geometrie als String.

        Google-Polyline-, WKT- oder GeoJSON-String.
      search_fields: |
        Durchsuchte Felder.

        Kommagetrennt. Beispiel: `name,dc:slug,dc:classification`.
      string_list: |
        UND-/ODER-Semantik.

        Mehrere Einträge = UND; ein kommagetrennter Eintrag = ODER. Beispiel: `["A","B"]` (UND) vs. `["A,B"]` (ODER).
      param: "Verschachtelter Inhaltsfilter in Bracket-Notation, z. B. `filter[search]=text` oder `filter[dc:classification][in][withSubtree]=UUID`. Entspricht dem `filter`-Objekt des POST-Bodys."
      body: "JSON-Request-Body für Inhalts-Endpunkte (POST); bildet die Query-Parameter plus den verschachtelten `filter` ab."
      delivery_params: "JSON-Request-Body für Einzelressourcen-Endpunkte (POST); bildet nur die Delivery-Query-Parameter ab (kein Filter)."
      body_filter: |
        Verschachtelter Inhaltsfilter.

        Als Objekt im POST-Body (siehe `Filter`-Schema). Beispiel: `{ "search": "zermatt" }`.
    envelope:
      context: "JSON-LD-@context: eine Basis-Vokabular-URI gefolgt von einem Objekt mit Namespace-Präfixen (@base, @language, skos, dct, dc, dcls, …)."
      total: "Gesamtzahl der passenden Einträge."
      pages: "Gesamtzahl der Seiten (entfällt, wenn page[limit] verwendet wird)."
      collection: "Vorhanden, wenn die Antwort auf einen gespeicherten Filter / eine Merkliste eingeschränkt ist."
      list: "JSON-LD-Antwort-Envelope. Einzelne Endpunkte verfeinern die @graph-Einträge auf das konkrete Entitätsschema."
    error:
      source: "Verweist auf die Ursache des Fehlers."
      parameter: "Name/Pfad des fehlerhaften Request-Parameters."
      pointer: "JSON-Pointer / Pfad zum fehlerhaften Wert."
      title: "Menschenlesbare Zusammenfassung des Fehlers."
      detail: "Menschenlesbare Erläuterung speziell zu diesem Auftreten."
    responses:
      bad_request: "Die Anfrage enthält ungültige Parameter."
      unauthorized: "Authentifizierung fehlt oder ist ungültig."
      not_found: "Die angeforderte Ressource existiert nicht."
      conflict: "Die Anfrage steht im Konflikt mit dem aktuellen Zustand einer anderen Ressource."
      unprocessable_entity: "Die Anfrage war wohlgeformt, konnte aber wegen Validierungsfehlern nicht verarbeitet werden."
    security:
      bearer: "JSON Web Token, übergeben als `Authorization: Bearer <token>`."
      token_query: "Zugriffstoken, übergeben als `token`-Query-Parameter."
    parameters:
      token: |
        API-Zugriffstoken.

        Alternative zum `Authorization`-Header. Beispiel: `?token=abc123`.
      fields: |
        Schränkt die zurückgegebenen Attribute ein.

        Kommagetrennter Attributbaum in Punktnotation. Beispiel: `name,dc:classification`.
      include: |
        Expandiert verknüpfte / eingebettete Entitäten.

        Kommagetrennter Attributbaum in Punktnotation. Beispiel: `location,openingHoursSpecification.dct:modified`.
      language: |
        Gewünschte Inhaltssprache(n).

        Kommagetrennte Liste; Standard ist die Standardsprache der Instanz. Beispiel: `de` oder `de,en`.
      sort: |
        Sortierung der Ergebnisliste.

        Kommagetrennte Sortierschlüssel; Präfix `-` = absteigend. Beispiel: `-dct:modified,name`.
      classification_trees: |
        Schränkt `dc:classification` auf bestimmte Bäume ein.

        Kommagetrennte Liste von Klassifizierungsbaum-Label-IDs.
      live_data: |
        Fordert Live-/berechnete Werte an.

        In Bracket-Notation; erlaubt sind nur die Schlüssel `@id` und `minPrice`. Beispiel: `dc:liveData[minPrice]=1`.
      format: |
        Ausgabeformat-Segment.

        Spiegelt die Media-Type-Aushandlung wider: `json` oder `csv`.
      page_size: "Anzahl der Einträge pro Seite."
      page_number: "Seitenzahl (1-basiert)."
      page_offset: "Zusätzlich zum Seiten-Offset übersprungene Einträge."
      page_limit: |
        Hartes Limit der zurückgegebenen Einträge.

        Überschreibt bei positivem Wert die size-/number-basierte Paginierung.
      section_flag: |
        Schaltet den `%{key}`-Abschnitt des Antwort-Envelopes.

        `0` = weglassen, `1` = einschließen.%{extra}
      section_flag_meta_extra: " Der Wert `0` überspringt zusätzlich die Gesamtzahl-Abfrage."
      page: "Paginierung (size / number / offset / limit)."
      section: "Envelope-Abschnitte ein-/ausschalten."
      api_subversion: "Optionales Versions-Präfixsegment der Route (`/api/v4(/:api_subversion)`); wird normalerweise von der Server-Basis absorbiert."
      external_source_id: "ID oder Identifier des externen Systems."
      external_key: "Externer Schlüssel eines Inhalts im externen System."
      attribute: "API-Name eines (Zeitserien-)Attributs im Pfad."
