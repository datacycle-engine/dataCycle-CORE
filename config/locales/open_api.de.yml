      duplicates:
        id: "UUID des Inhaltes, dessen Duplikate adressiert werden."
        duplicate_id: "UUID des Duplikat-Inhaltes des Paares."
        index_summary: "Duplikatskandidaten eines Inhaltes abrufen"
        index_response: "Die Duplikate des Inhaltes, höchster Score zuerst."
        create_summary: "Zwei Inhalte als Duplikate markieren"
        create_description: |
          Markiert das Paar explizit, als eigener Kandidat mit der Methode `manual` und Score 100,
          neben allen automatisch erkannten Kandidaten. Die Markierung bleibt bei der automatischen
          Neuberechnung erhalten und reaktiviert ein als False Positive verworfenes Paar.
        create_response: "Das Paar wurde neu markiert; Body wie beim GET-Endpunkt."
        create_existing_response: "Das Paar war bereits manuell markiert; Body wie beim GET-Endpunkt."
        merge_summary: "Duplikat in den Inhalt zusammenführen"
        merge_description: |
          Die Zusammenführung läuft asynchron (MergeDuplicateJob), damit die Antwortzeit nicht von
          der Anzahl der zu verschiebenden Verlinkungen abhängt. Vorher wird auf dem Zielinhalt eine
          benannte Version geschrieben, die den Merge dokumentiert.
        merge_response: "Die Zusammenführung wurde eingeplant; das Paar ist aus den Kandidaten verschwunden."
        false_positive_summary: "Duplikat als False Positive verwerfen"
        false_positive_description: |
          Das Paar verschwindet aus den Kandidaten und wird von der automatischen Neuberechnung nicht
          wieder aufgenommen. Über `falsePositive=true` bleibt es abrufbar und kann durch erneutes
          manuelles Markieren reaktiviert werden.
        false_positive_response: "Das Paar wurde verworfen; Body wie beim GET-Endpunkt."
        false_positive_param: "`true` liefert die verworfenen Paare statt der aktiven."
        mark_request: "Der Inhalt, der als Duplikat des adressierten markiert wird."
        mark_request_id: "UUID des zu markierenden Inhaltes. Muss denselben Inhaltstyp haben und darf nicht eingebettet sein."
      external_connections:
        id: "UUID des Inhaltes, dessen externe Verknüpfungen adressiert werden."
        property_id: "Identifier, Name oder UUID des externen Systems."
        value: "Externer Schlüssel (`external_key`) der Verknüpfung."
        response: "Der vollständige Verknüpfungsstand des Inhaltes nach der Änderung."
        create_summary: "Externe Verknüpfung hinzufügen"
        create_description: |
          Legt eine Verknüpfung vom Typ `duplicate` an. Idempotent: eine bestehende Verknüpfung
          bleibt unverändert. Antwortet mit 422, wenn für dasselbe `propertyID`/`value`-Paar bereits
          ein Import oder Export zuständig ist.
        destroy_summary: "Externe Verknüpfung entfernen"
        destroy_description: |
          Entfernt eine Verknüpfung vom Typ `duplicate`. Idempotent: eine nicht mehr vorhandene
          Verknüpfung ist kein Fehler, der aktuelle Stand wird zurückgegeben.
        promote_summary: "Verknüpfung zum Primärsystem hochstufen"
        promote_description: |
          Das bisherige Primärsystem bleibt als Verknüpfung vom Typ `duplicate` erhalten, es gehen
          also keine Daten verloren. Antwortet mit 409, wenn ein anderer Inhalt diesen externen
          Schlüssel bereits als Primärschlüssel verwendet.
        demote_summary: "Primärsystem herabstufen"
        demote_description: |
          Wandelt das primäre externe System des Inhaltes in eine Verknüpfung vom Typ `duplicate`
          um. Danach hat der Inhalt kein Primärsystem mehr, der externe Schlüssel bleibt erhalten.
