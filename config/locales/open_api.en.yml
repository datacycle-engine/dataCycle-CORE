        collection_id: "Collection (watch list) id."
        collection_redirect: "Redirect to the collection's content listing."
        create_summary: "Create a new (download) collection."
        create_description: "Creates a new collection (watch list), optionally pre-filled with the given content ids. Requires the :create ability on WatchList. Responds with HTTP 200."
        create_response: "The created collection ({ id, name })."
        create_thing_id: "One or more content UUIDs to pre-fill the collection with."
        add_item_summary: "Add a content to the collection."
        add_item_response: "The updated collection."
        remove_item_summary: "Remove a content from the collection."
        remove_item_response: "The updated collection."
        item_thing_id: "UUID of the content to add/remove (in the path or the body)."
        download_and_reset_summary: "Download the collection as a file and reset it."
