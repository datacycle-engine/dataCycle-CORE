        concepts_search: "Full-text search over the concept name."
        concept_summary: "List the concepts below a given concept of a concept scheme."
        concept_classification_id: "Concept (classification alias) id to scope the result to."
      endpoints:
        endpoints_summary: "List accessible data endpoints (published stored filters)."
        endpoints_response: "A JSON-LD list of data endpoints."
        create_summary: "Create an endpoint / stored filter."
        create_description: "Creates a collection / stored filter from a source endpoint and the given content query. Responds with HTTP 201."
