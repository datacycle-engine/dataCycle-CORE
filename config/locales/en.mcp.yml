en:
  mcp:
    # Server instructions (Mcp::ServerInstructions): the only text a client sees BEFORE its first
    # tool call -- initialize/server/discover deliver it, tools/list does not.
    #
    # What belongs here is ONLY what holds mount-wide and cannot sit in any single tool description:
    # which result space applies, which language is used, in what order to work, how to report a
    # number, and whether writing is allowed. The per-tool detail lives in mcp.tools.* -- do NOT
    # repeat it here, or the two versions drift apart and a client ends up with two manuals whose
    # contradiction it cannot resolve.
    #
    # Assembled in this order: <endpoint|global>, language, workflow, reporting,
    # <write_enabled|read_only>. A client that truncates the text therefore loses the optional part
    # first and not the result space.
    instructions:
      endpoint: "This access delivers the contents of the endpoint \"%{endpoint_name}\" -- a curated subset of the instance, not its full holdings. Every number from these tools applies to that subset: \"does not exist\" always means \"not in this endpoint\" here, and must be phrased that way to the user."
      global: "This access delivers every content the calling user is allowed to see through the api -- no endpoint scope. Facets and totals are correspondingly broad and mix holdings that have nothing to do with each other. For a curated view call list_endpoints and continue with the endpoint access."
      language: "Language of this session: %{session_locale} (available: %{available_locales}). Tools without an explicit locale argument work in %{session_locale}; that includes the language written to."
      workflow: "Procedure, in this order: first look at the structures that exist (list_facets and facet_values for classifications, list_attributes for attributes, list_templates or get_schema for content types), then filter structurally. Categories, topics, regions, types of business and difficulty ratings are ALWAYS classifications and never full text; full-text search is the last resort for literal quotes and proper names. The user's term is not the data model's term -- resolve it before filtering (resolve_concepts, resolve_place, facet_values) instead of guessing it."
      reporting: "Before reporting a number: read the response's applied_filters and state the filter that was actually applied. An empty list is NOT automatically a finding about the data -- it can equally mean that a system precondition of this instance is unmet (feature not enabled, nothing released for the api, derived structure absent). The tool descriptions state under \"system precondition(s)\" how to tell the difference; that difference belongs in the answer to the user instead of being reported as \"does not exist\"."
      read_only: "This access is READ-ONLY: there are no tools that create or change contents. A request to change something must be answered as not possible here, and not substituted with a read call."
      write_enabled: "This access can also WRITE (create_content, update_content). Both persist immediately and have no undo: only call them when the user has explicitly asked to create or change something, not when they merely talked about contents. Before reporting success, check and name the response's ignored_attributes and warnings."
    # Where they exist, tool descriptions end with a "System prerequisite(s):" paragraph. It states
    # what must hold ON THE SYSTEM before the tool -- or a single argument -- can have any effect:
    # enabled features, instance-specific configuration, API visibility releases, derived structures
    # (full-text index, materialized views) and data facts such as geometry or time series.
    #
    # Purpose: an unmet system prerequisite looks like a finding about the data. The filter is
    # silently not applied or the list comes back empty, the answer is plausible, and the client
    # reports "there is none" where "not configured/not released here" would be correct. These
    # paragraphs make that distinction decidable for the client and name the signal it can check
    # (resolved false, an empty list, a specific error message).
    # Prompts (Mcp::Prompts::*): entry points the USER picks in the client -- the third way this
    # server offers context, next to the instructions (always apply) and the tool descriptions
    # (apply per tool).
    #
    # DELIBERATELY THIN. The procedure lives in mcp.instructions and is referenced here, not
    # repeated; what is left is only what distinguishes THIS task from any other question. Kept
    # as a second version of the same manual, the two would drift apart and a client would end up
    # with two procedures whose contradiction it cannot resolve.
    prompts:
      inventory_question:
        description: "Answer a question about the holdings (\"how many\", \"which\", \"is there\") -- together with the filter the number came from."
        message: "Answer this question about the holdings: %{question}\n\nFollow the procedure described in the server instructions, and additionally: (1) Resolve every term of the question separately before filtering -- a term often exists as several concepts, and an incomplete selection returns a plausible but too low number. (2) Conditions that must hold AT THE SAME TIME belong in separate AND groups, not in one shared list. (3) Turn on explain whenever you report or compare a number. (4) State the filter actually applied from applied_filters in your answer, not just the number -- and say what it refers to."
        arguments:
          question: "The user's question, verbatim."
      write_content:
        description: "Create or change a content -- including a check of what was actually stored."
        message: "Carry out this change to the data: %{intent}\n\nFollow the procedure described in the server instructions, and additionally: (1) Determine the template first and take the attribute names from list_writable_attributes -- NOT from get_schema or list_attributes, whose api names are discarded when writing. (2) Pass classifications as resolved concept UUIDs, never as plain text. (3) Check the response BEFORE reporting any success: ignored_attributes names what was silently discarded, changed_attributes what actually changed, warnings the missing required entries. (4) Report what was NOT stored just as clearly as the success."
        arguments:
          intent: "What is to be created or changed, in your own words."
    tools:
      search_contents:
        description: "Structured search within the %{endpoint_name} endpoint. FILTER STRUCTURALLY, DO NOT FULL-TEXT SEARCH: always express categories/types/topics as classification facets (list_facets -> facet_values -> classification_alias_ids, or exclude_classification_alias_ids for \"everything except\", optionally including the subtree via include_subtree), value constraints via attributes (list_attributes gives names/types, e.g. \"price < 20\"), radius via near, time ranges via schedule, presence/absence of a relation via has_relations/missing_relations. Facets that must ALL hold at once (difficulty AND region AND category) belong in classification_alias_id_groups -- one group per condition; in a single classification_alias_ids list they are OR-combined and return more results instead of fewer. Conversely, ALL concept variants of ONE condition belong in the SAME group: import sources often express the same fact as several UUIDs (identically named or synonymous), and filtering on only one of them yields a plausible but understated count. Do NOT assemble those groups yourself: resolve_concepts returns the ready-made group per term. The query parameter is ONLY for genuine free text (a literal quote or proper name the user actually searched for) and is the LAST RESORT -- before using query, call list_facets/facet_values or list_attributes and check whether the request can be expressed structurally. Never pass template/type names (e.g. \"TouristAttraction\"), category names or place names as query: types belong in template_names (discovery: list_templates), categories and places in facets -- as a query they either return 0 results even though matching contents exist, or a far too large set spanning all types. A category name passed as query typically matches a multiple of its structured equivalent, because it also collects every content that merely mentions the word in its description (accommodations, articles); how large the gap is in the data at hand shows up by running the same call once with query and once with template_names + the category facet, both with explain: true. Besides count/items the response carries applied_filters with the RESOLVED filter: concept names per AND group, the concepts additionally pulled in by include_subtree (subtree_concepts, capped to a sample; subtree_concept_count gives the total), the unit of each attribute filter, and unresolved_ids for passed UUIDs without a concept (those filter nothing -- usually an alias id confused with a classification id). Before reporting a result count, check applied_filters to confirm exactly the intended set was filtered, and name the categories used in the answer: the same question often allows several defensible concept mappings, and a count without its filter cannot be verified. When the count is reported or compared against another source, additionally pass explain: true -- applied_filters.explain then gives the count after EVERY filter step and shows how much each condition removes. A question for the \"largest/longest/nearest/newest N\" MUST set sort: without it the editorial default order applies and limit returns an ARBITRARY subset -- reported as a ranking that is a plausible wrong answer. The sorted value is returned per hit as sort_value (with sort_unit) and must be checked before reporting; if a key is not sortable the error names the ones that are -- do not fall back to query or to sorting in the client. System prerequisites of the individual filters -- an unmet one is mostly SILENTLY ineffective rather than failing: place requires the mcp feature with its geo cascade enabled (mcp.geo.enabled) and at least one resolution tree configured (the gem ships only the administrative tree, every further one is instance-specific) -- without both, applied_filters.place.resolved is false and the count is the unfiltered endpoint set. attributes only works with names from list_attributes (properties carrying advanced_search in the template definition): a name unknown there fails with \"attribute is unknown\", whereas an existing property name that is not configured as advanced_search is silently skipped and returns a plausible but in fact unfiltered count. near requires coordinates on the content and skips those with latitude/longitude 0/0, which are locatable only through their address -- for \"in <place>\" use place instead of near. schedule only matches contents with dates (event occurrences); template_names and the facet arguments have no system prerequisite of their own, their discovery (list_templates, list_facets/facet_values) already shows what actually exists."
        arguments:
          query: "LAST RESORT -- genuine free text only (a literal quote, a proper name). Use classification_alias_ids for categories/types/topics (list_facets/facet_values), attributes for values (list_attributes), place for locations (radius around a point: near), schedule for periods. Do NOT pass template/type names (e.g. \"TouristAttraction\"), category names or place names here -- they return 0 hits even though matching contents exist."
          template_names: "Only contents of these content templates (schema.org types), OR-combined -- available names with counts via list_templates. Type and category are DIFFERENT dimensions: the type goes here, the category (\"Restaurant\", \"Hotel\") into the classification facets. If the user asks for a type (\"restaurants (FoodEstablishment)\"), check BOTH -- the same thing is modelled differently per instance (gastronomy e.g. as TouristAttraction plus a category rather than as FoodEstablishment). Without this filter, a category facet from a tree that classifies several types can count contents of other types too (e.g. accommodations carrying a gastronomy category)."
          classification_alias_ids: "Only contents assigned to AT LEAST ONE of these classification alias UUIDs (positive facet, OR-combined). Use it for a SINGLE condition only. As soon as several facets have to hold at the same time (e.g. difficulty AND region AND category) they belong in classification_alias_id_groups -- in one shared list they would be OR-combined and the result set would grow instead of shrink. For the UUIDs see list_facets/facet_values."
          classification_alias_id_groups: "Several positive facet conditions: OR within a group, AND between the groups. One group per condition or per classification tree, e.g. [[<medium>], [<Vorarlberg>], [<hiking>, <mountaineering>]] for \"medium AND in Vorarlberg AND (hiking OR mountaineering)\". Combinable with classification_alias_ids, which acts as a further AND group. Do not assemble the group for a condition yourself, get it from resolve_concepts (classification_alias_id_group) -- one term often exists as several UUIDs, and an incomplete group returns a plausible but too low number."
          exclude_classification_alias_ids: "Contents assigned to AT LEAST ONE of these classification alias UUIDs are EXCLUDED (negative facet, e.g. \"everything except category X\")."
          include_subtree: "Whether subcategories (subtree) of the given classifications count as well. Applies to classification_alias_ids and exclude_classification_alias_ids. Default true; false = exactly the named concepts only."
          schedule: "Period filter on event occurrences. Absolute: {\"from\": \"2026-07-21\", \"until\": \"2026-07-28\"}. Relative: {\"from\": {\"n\": 0, \"unit\": \"day\", \"mode\": \"p\"}, \"until\": {\"n\": 1, \"unit\": \"week\", \"mode\": \"p\"}}."
          place: "Place name for an administrative geo filter (\"in Vorarlberg\", \"in the municipality of Egg\") -- the exact concept name; resolve it and check its coverage with resolve_place beforehand. Do NOT model this through classification_alias_ids: that matches the tree assignment only, and contents without one are silently missing from the result -- depending on the holdings a substantial share. This filter falls back per content to geo_regions or to the address. If the name cannot be resolved, NO geo filter applies and the count is the endpoint total -- recognisable by applied_filters.place.resolved = false. Which source the hits were matched through is named by applied_filters.place.coverage with explain: true (see there). For radius searches use near instead."
          near: "Geo radius filter around a POINT. Returns only contents within radius_km of lat/lon. For \"in <place>\" use place instead."
          attributes: "Structured attribute filters instead of full text (e.g. \"price < 20\"). Attribute names and types via list_attributes. Combinable with facets/geo/period. Per condition, in OR not_in is MANDATORY -- an entry with a bare attribute filters nothing and is rejected."
          has_relations: "Only contents that have EVERY one of these relations set (relation name, e.g. \"image\")."
          missing_relations: "Only contents that lack EVERY one of these relations (relation name, e.g. \"image\" for \"no photo on file\")."
          limit: "Max. number of results"
          explain: "Turns on the response's diagnostics: applied_filters.explain records the cumulative hit count AFTER every single filter step (the endpoint total, then per facet group, attribute filter, period, geo, relations) and shows which condition removes how much; with place set, applied_filters.place.coverage is added, the hit count per source of the geo cascade (classification tree / geo_regions / address) -- a number carried mostly by the address is more weakly evidenced than one from the tree. That narrows a surprising count, or one diverging from another source, down to a single step. Turn it on for every number that is reported or compared against another; otherwise leave it off (every step and every cascade stage costs a COUNT of its own)."
          attribute_condition:
            attribute: "api_name of the attribute (see list_attributes)."
            in: "Condition: min = >=, max = <= (number or date), equals = exact, like = contains (text), bool = boolean. Several keys = AND."
            not_in: "Like \"in\", but negated (e.g. not_in.equals = not equal)."
      get_content:
        description: "Loads a single content by ID within the %{endpoint_name} endpoint (only contents visible in this endpoint). System prerequisite: visibility follows THIS endpoint's filters. An ID obtained elsewhere (universal_lookup, a link) may be unfindable here even though the content exists -- that is a scope question and should be reported as one."
      suggest:
        description: "Autocomplete word suggestions within the %{endpoint_name} endpoint (full-text word statistics). For input completion in a UI, NOT for filtering and not a substitute for search_contents -- resolve categories/types/places via list_facets/facet_values. System prerequisite: the full-text index (searches) for the requested language. It is built per translation when a content is saved or imported -- for a language without an index the suggestion list comes back empty even though the endpoint holds contents. An empty answer here is therefore not a finding about the data: check against the maintained language (locale) before reporting."
        arguments:
          locale: "Language, default %{default_value}"
      suggest_by_title:
        description: "Autocomplete title suggestions within the %{endpoint_name} endpoint (content title similarity). Only when the user is looking for a specific title; not for resolving categories, types or places (use list_facets/facet_values). System prerequisite: the same full-text index (searches) as suggest, here over the headline per translation. Without an index for the requested language the list is empty without the title being missing."
        arguments:
          locale: "Language, default %{default_value}"
      list_facets:
        description: "Lists the concept schemes (classification trees) relevant to the %{endpoint_name} endpoint -- use before facet_values. CAUTION, this is a CURATED selection, not an exhaustive list: only one tree per dimension is kept, so that facets stay legible for a client. If an entire DIMENSION is missing here (e.g. cuisine/diet, amenities), that does NOT mean the endpoint holds no such data -- the tree may simply not be curated. In that case call browse_concept_schemes (WITHOUT search, since no tree is named after the dimension) on the instance-wide server, identify the matching tree in the full list, and pass its ID to facet_values or its concepts to search_contents anyway -- both accept non-curated trees as well. Every entry carries a description field where a definition exists for the tree: which dimension it covers, how it is structured, how well it is populated and what it does NOT contain. Read those definitions BEFORE picking a tree -- the names alone are misleading -- a tree name often does not state the dimension it actually carries, and says nothing about the one it does NOT contain. A choice made by name is plausible and still wrong. If the field is absent the tree is undocumented -- then inspect its values via facet_values instead of inferring its meaning from the name. System prerequisites: the curated selection is the endpoint's facet configuration (StoredFilter). If none is configured there, the tool derives the trees from the endpoint's contents instead -- and then only trees released for the API and not marked internal appear. That release applies system-wide and to browse_concept_schemes/list_concepts as well: a tree without it is invisible over MCP entirely, even though contents are classified with it and its concepts exist in the data. So if a dimension is missing from BOTH lists, that is a release/configuration question for the instance and not a statement about the data."
      facet_values:
        description: "Shows classification values (concepts) with content counts within a tree for the %{endpoint_name} endpoint (see list_facets for available trees; also works for non-curated trees from browse_concept_schemes). By default only concepts holding at least one content: if a place, region or category the user named does not appear WITHIN a tree that actually covers that dimension, the endpoint does not cover it -- report that as \"no data for this region\" instead of working around it with a full-text search. Only draw that conclusion once a tree of the matching dimension has actually been checked: if the dimension is absent from list_facets entirely, that is a curation gap and NOT a finding about the data -- then first look for the tree via browse_concept_schemes (without search) and list_concepts (with search) on the instance-wide server. Whether the concept exists at all is answered by list_concepts (with search) on the instance-wide server. Every value carries parent_id (nil for root nodes) and is_leaf, so the list is a tree -- evaluate that BEFORE filtering: with include_subtree a parent node pulls in its entire subtree, including sibling categories the user's term does not mean (example: \"Bergsteigen\" holds not only \"Bergtour\" but also \"Klettersteig\", \"Hochtour\", \"Alpinklettern\" -- so \"hiking\" is not the same as the parent node). If a user's term only covers part of a subtree, pass the matching child nodes individually instead of the parent. thing_count_without_subtree 0 combined with is_leaf false marks a pure grouping node that carries no content of its own. The response additionally carries a description field with the definition of the queried tree (where one exists) -- it names structure and pitfalls that the flat value list does not reveal, such as pseudo nodes between root and values, or identically named concepts that must be filtered together. System prerequisite: the counts are computed over THIS endpoint's result set, including its own filters. The same question against another endpoint therefore yields different numbers, and the instance-wide figure from list_concepts (thing_count) is regularly larger -- name the endpoint when reporting instead of presenting these counts as instance-wide."
        arguments:
          min_count_with_subtree: "Minimum number of contents (incl. subtree), default 1 -- only concepts under which the endpoint actually has contents. 0 includes empty concepts as well (for large trees many thousand values)."
          min_count_without_subtree: "Minimum number of contents (without subtree), default 0"
      resolve_concepts:
        description: "Maps ONE user term (e.g. \"vegan\", \"hiking\") onto ALL matching concepts within the %{endpoint_name} endpoint and returns, in \"classification_alias_id_group\", a ready-made OR-combined group for search_contents' classification_alias_id_groups -- pass that list on unchanged. Call it BEFORE search_contents for every category, topic or amenity condition, one call per condition (\"vegan restaurants in Vorarlberg\" is three). It replaces collecting variants by hand via facet_values/list_concepts: in imported data the same fact exists as several concepts with different UUIDs (e.g. \"Vegan\", \"Vegane Kost\", \"Vegane Speisen\" as separate concepts, depending on the import source), and filtering on just one of them yields a plausible but massively understated number. \"count\" is the real hit count of the union (not the sum of the individual counts, which double-counts contents carrying several variants), \"largest_single_variant_count\" is the strongest single variant -- the difference is exactly the error a single name match would have caused. In \"concepts\" every variant carries its endpoint-specific count and, when it is NOT part of the group, the reason (empty in this endpoint, or redundant because an ancestor already covers it via subtree). The union is a name-based proposal and must therefore be checked against \"concepts\" BEFORE reporting a number: a short term also collects compounds the user does not mean (e.g. \"Restaurant\" also matches \"Schnellrestaurant/Fast Food\" and \"Bar-Restaurant\" -- the gap between count and largest_single_variant_count shows how much that adds up to). Drop the variants that are not meant and name the concepts used in your answer. If the tool finds nothing, \"classification_alias_id_group\" is EMPTY and the response contains NO count but a \"warning\" instead: passing an empty group to search_contents filters nothing and returns the endpoint total -- reported as an answer that is a massively inflated number (typical case: an amenity term like \"barrierefrei\" exists identically named in several trees, yet no content in THIS endpoint carries it). Report this case as \"the endpoint carries no classification for this\", or check a non-curated tree found via browse_concept_schemes by passing concept_scheme_ids -- do NOT fall back to the query full-text search."
        arguments:
          term: "The user's term for ONE condition, e.g. \"vegan\" or \"hiking\". Not several conditions together (\"vegan restaurants in Vorarlberg\") -- one call per condition, and each result becomes one group in classification_alias_id_groups."
          concept_scheme_ids: "Search in these classification trees only (ids from list_facets/browse_concept_schemes). Without them the facets of this endpoint are searched -- the same ones list_facets names."
          include_empty: "Also take variants without contents in this endpoint into the group. Default false -- they filter nothing out but inflate the group."
          limit: "Max. number of name matches checked"
      list_templates:
        description: "Lists the content templates (schema.org types) that actually occur in the %{endpoint_name} endpoint, with counts -- the discovery counterpart to search_contents' template_names filter. Call it BEFORE answering any question about a type (\"restaurants (FoodEstablishment)\", \"all accommodations\"): if a type the user named is absent from this list, the endpoint does not carry it and the question is NOT answerable via template_names -- then check whether the fact is modelled as a category instead (list_facets/facet_values). Which form applies here only shows when this list is compared with the facets from list_facets -- a type the user names that is missing here often exists as a more general type plus a category facet. Type and category are two different dimensions and both must be checked: the type separates a restaurant from an accommodation, the category separates a restaurant from a bar. System prerequisite: the list is counted from the endpoint's contents, not from the installed templates -- a template without content in the endpoint is missing here even though the instance knows it and get_schema describes it. \"The type does not exist\" is therefore not derivable from this list, but \"this endpoint carries no contents of that type\" is."
      list_attributes:
        description: "Lists the attributes filterable (advanced_search) for the %{endpoint_name} endpoint along with their type, label and unit -- use before the attributes filter of search_contents. ALWAYS pass values in \"attributes\" in the \"unit\" given here, not in the unit of the user's question: with unit \"m\", \"under 15 km\" becomes max: 15000. A missing \"unit\" means the attribute is unitless. System prerequisites: the list comes from the template definitions (properties with advanced_search, materialized from the installed templates), NOT from the data -- an empty list means \"no attribute is configured as filterable for this endpoint's templates\" and is a configuration gap, not a reason to fall back to query. An attribute newly configured as filterable only appears after the next template import, which refreshes that materialized view. If the tool answers with a database/SQL error instead of a list, the instance's schema is behind its migrations -- report that as an instance problem instead of working around it with another call."
      statistics:
        description: "Time-bucketed statistics (content count per time bucket) for the %{endpoint_name} endpoint. Only \"dct:created\"/\"dct:modified\" are valid attributes. System prerequisite and caveat: both timestamps are technical system times (created and last written IN the system), not editorial data. An import run sets dct:modified for thousands of contents at once, and a whole stock can sit on the migration/import date -- spikes in the curve therefore show system events and NOT editorial activity, let alone content-level dates such as event schedules (use search_contents' schedule filter for those). When reporting, say that what is counted is when a content was last written."
        arguments:
          attribute: "Timestamp attribute"
      timeseries:
        description: "Time series data (e.g. sensor/weather readings) for a single content within the %{endpoint_name} endpoint. System prerequisite: the requested attribute must be modelled as a time series on this content's template and be populated for it -- time series come from connected measurement sources and exist on few templates only. If it is not a time series property, the tool reports \"no timeseries data found\"; that is this content's modelling/data situation, not a wrong argument. get_content shows which properties a content carries."
        arguments:
          id: "(must be visible in the endpoint)"
          attribute: "(see get_content for the available properties)"
      elevation_profile:
        description: "Elevation profile of a route/line (content with line geometry and elevation data) within the %{endpoint_name} endpoint. System prerequisites: the content needs a primary line geometry (LINESTRING/MULTILINESTRING) AND elevation values within it (Z coordinate). Both are up to the import source: a point geometry (POI, accommodation) never has a profile, and neither does a tour without Z values. If either is missing the tool answers \"not found\" with the corresponding reason (no geodata / no elevation data) -- that distinguishes \"content does not exist\" from \"content carries no elevation data\" and should be reported as such instead of read as a missing content."
        arguments:
          id: "(needs line geometry with elevation data)"
      download:
        description: "Returns a download URL for the %{endpoint_name} endpoint (or a single content within it) in the requested format. No file bytes are transferred over MCP -- the URL requires the same Bearer token as this MCP session. System prerequisites: the download feature must be enabled for this target (endpoint or content) and a serializer must be enabled for the requested format. Both are instance- and endpoint-specific, which is why there is deliberately no fixed format list here -- a format that is not released is rejected with \"invalid_format\". That rejection says nothing about the contents: it means \"this endpoint does not hand out this format\", not \"there is nothing to download\"."
        arguments:
          id: "(optional: for a single download, otherwise the whole endpoint)"
          format: "Serialisation format, e.g. \"gpx\", \"json\", \"xml\""
        # Part of the RESPONSE, not of the description: the returned URL is not an open link.
        note: "Requires the same Bearer token as this MCP session (Authorization header)."
      select_things:
        description: "Loads multiple contents by a list of IDs, instance-wide (no endpoint scope) -- the batch counterpart of get_content, which takes a single ID. System prerequisite: the API visibility scope of the calling user (the API filters configured for them). The response may therefore contain FEWER entries than IDs passed without that being an error -- missing IDs are either unknown or outside the scope; distinguish the two when reporting."
        arguments:
          limit: "Max. number of results"
      resolve_place:
        description: "Resolves a place name (state, district, municipality) into a geo filter and reports the hit count per source -- the discovery step for search_contents' place filter. Call it BEFORE any question with a place reference (\"in Vorarlberg\", \"in the municipality of Egg\") instead of expressing the place via classification_alias_ids or query. The reason is a coverage gap: a plain classification facet only matches contents THAT HAVE a tree assignment, and contents without one are silently missing from the result -- a substantial share, depending on the data, because some contents carry neither a tree assignment nor usable coordinates and are locatable only through their address. The tool therefore takes ONLY a place name: resolution runs server-side in a fixed order (classification tree, then geo_regions via polygon, then address) and applies per content. That order is NOT selectable and cannot be bypassed. coverage reports how many hits come from which stage: a result mostly from \"address\" is more weakly supported than one from \"classification\" and should be mentioned when reporting the number. resolved false means the name does not exist in the trees checked -- the question is then NOT answerable via place, and the place name must not be used as query either. System prerequisites, different per stage and each separately disableable: the cascade as a whole needs the mcp feature with its geo cascade enabled (mcp.geo.enabled); if it is off or no resolution tree is configured (the gem ships only the administrative tree, every further one is instance-specific), resolved is ALWAYS false -- regardless of whether the place exists in the data. Stage 2 (geo_regions) only applies if trees are configured whose concepts carry polygons; without such trees it never contributes. Stage 3 (address) depends on two settings: the administrative prefixes stripped before the name comparison (\"Gemeinde Egg\" -> \"Egg\") and the postal code patterns per place -- without the postal code patterns exactly those localities are missing that do not exist as concepts in the tree. stages[].resolved states per stage whether it can contribute anything for THIS place; if all of them are false, that is a configuration gap of the instance and must be reported as such, not as \"no data\"."
        arguments:
          place: "Place name as the user gave it (state, district, municipality), e.g. \"Vorarlberg\". The exact name, not a substring -- \"Bregenzerwald\" instead of \"Bregenzerwald Tourismus\"."
      recent_queries:
        description: "Lists the calling user's most recent MCP queries, newest first: per entry the tool that was called, the ARGUMENTS of that call, the reported result count and the endpoint it was measured against (empty = instance-wide). Meant for picking up a previous query instead of guessing it: on \"and how many of those ...\", \"same for ...\", \"what was that number again\", fetch this history first and start from the logged arguments -- a freshly assembled filter yields a different number, and the difference is invisible to the user. The arguments are logged verbatim and can be passed straight back into the same tool. Failed calls are in the history too (\"error\"), so the same failure is not repeated. Use \"tool\" to narrow it down to one tool, e.g. \"search_contents\"."
        arguments:
          limit: "Max. number of entries, newest first"
          tool: "Only calls of this tool, e.g. \"search_contents\""
      universal_lookup:
        description: "Determines the type of an arbitrary UUID (content, concept scheme, concept, schedule) and returns a short descriptor -- a starting point for resolving an unknown ID further. System prerequisite: the lookup only searches where the calling user is allowed to look -- contents within the API visibility scope (see select_things), trees and concepts only as far as they are released for the API. An unresolved UUID may therefore still exist; \"unknown\" here means \"not found in any of the accessible sources\"."
        arguments:
          id: "(content, concept scheme, concept or schedule)"
      browse_concept_schemes:
        description: "Lists all instance-wide available concept schemes (classification trees), optionally filtered by name. Entries of documented trees carry a description field stating dimension, structure, coverage and the distinction from similarly named trees -- read it before choosing, because the name alone often does not reveal the dimension. The search parameter matches the NAME only, not these definitions: searching for a tree by its dimension (\"diet\", \"amenities\") therefore regularly fails even though the tree exists -- in that case call it without search and go through the full list with its definitions. System prerequisite: only trees released for the API and not marked internal are listed. A tree without that release is missing here entirely -- along with its concepts, which list_concepts then cannot resolve either -- even though contents are classified with it. \"Does not exist\" is therefore not derivable from this list; with no match, all that remains is to report the dimension as not accessible over MCP on this instance."
      list_concepts:
        description: "Lists concepts within a concept scheme (from browse_concept_schemes). Use \"search\" to map user terms (e.g. \"hiking\") to concept IDs; without \"search\", only the top-level concepts are returned. IMPORTANT when there are several matches: the same fact often exists as multiple concepts with different UUIDs, because every import source brings its own variant -- identical names as well as synonyms (e.g. \"Vegan\", \"Vegane Kost\", \"Vegane Speisen\" as four UUIDs, three of them populated). NEVER just take the first match: that yields a plausible but massively understated result count. Collect all semantically equivalent variants and pass them OR-combined in ONE classification_alias_id_groups group to search_contents. Each result carries thing_count (number of contents instance-wide, excluding embedded): it shows which variants are populated and what dropping one costs. A variant with thing_count 0 may be dropped, any other one may NOT. facet_values gives the endpoint-specific count. Do NOT do this collecting by hand when working within an endpoint: resolve_concepts (endpoint server) performs the union, returns the ready-made group and the real union count -- this tool remains the instance-wide fallback for concepts outside any endpoint. System prerequisites: the tree must be released for the API and not marked internal (otherwise the concept_scheme_id cannot be resolved, see browse_concept_schemes). thing_count is counted instance-wide and without embedded contents, i.e. WITHOUT the endpoint scope and without the user's API visibility scope -- the figure serves to compare the size of the variants and is not a result count that may be reported or compared against search_contents."
        arguments:
          concept_scheme_id: "(from browse_concept_schemes)"
          search: "(to map user terms onto concepts, e.g. \"hiking\"; without it only the topmost concepts are returned)"
          limit: "Max. number of results"
      list_endpoints:
        description: "Lists the API endpoints (StoredFilters with api: true) available to the calling user -- a starting point for finding a suitable single-endpoint MCP server. Per endpoint it returns, where maintained, \"description\" (the editorial description, without markup), \"language\" and \"concept_schemes\": THESE are the basis for choosing, not the name -- a name like \"Touren\" says neither what else is in there nor which dimensions can be filtered on. A missing field means \"not maintained\", not \"empty\"; missing concept_schemes in particular do NOT mean the endpoint has no facets -- without curation list_facets derives them there from the trees that actually occur. How many contents an endpoint holds and which templates occur in it is deliberately NOT here (only executing the respective filter answers that): for that, call list_templates or search_contents without filters at the endpoint itself. System prerequisites: a stored filter only appears here if it is released as an API endpoint (api: true), is named, and the calling user is allowed to see it. An expected but missing endpoint is thus a release, naming or permission question and not a hint about missing contents. Each endpoint also needs its own MCP server configuration in the client (its own URL, the same Bearer token) -- being listed here does not mean it is queryable from this session."
      describe_endpoint:
        description: "Describes ONE endpoint in full and says WHICH TOOLS ANSWER ANYTHING THERE -- the entry point before the first content query and the answer to \"what can I ask here\". Without an argument it describes this server's result space (at the endpoint mount, the endpoint the client is connected to -- it does not need to know it); with \"endpoint_id\", any endpoint released to the user (ids from list_endpoints). It returns: \"content_count\" and \"templates\" (types with counts, like list_templates); \"details\" -- the detail dimensions carried, each with \"templates\"/\"api_names\" (which types DECLARE the dimension, i.e. what a content CAN carry) next to \"content_count\"/\"share\" (how many contents actually DO carry it); and \"tools\" -- a verdict per tool of this server. Those two figures per dimension are NOT the same thing and are the reason this tool exists: a type may declare a line with elevation data while not a single content of the endpoint carries one -- elevation_profile then answers \"not found\" for every content, which gets read as one's own mistake and retried instead of as an empty dimension. A dimension MISSING from \"details\" is declared by no type of this endpoint (it does not exist here at all, it is not merely unmaintained). The three verdicts in \"tools\": \"recommended\" = worthwhile here because a noteworthy SHARE of the contents carries the dimension (or because it is a core tool); \"available\" = works, but is not the entry point -- either the tool hangs on no measured dimension (then \"detail\" is absent), or its dimension is populated but too thin to recommend (then \"detail\" names it, and its \"share\" under \"details\" says how thin: at 0.009 one hit in a hundred contributes anything). An \"available\" WITH a \"detail\" is therefore no reason to avoid the tool -- it does answer for the few contents that carry the dimension; it just does not work as the entry point for the endpoint as a whole. \"no_data\" = the dimension named under \"detail\" is not declared here or is EMPTY (not a single content carries it), so the tool answers empty for EVERY content -- that is not an error, do not retry it, and report it to the user as \"this endpoint does not carry that\". IMPORTANT with a foreign endpoint_id: \"queryable_here\" false means all other tools still run against THIS server's result space, not the described one -- the described endpoint needs its own MCP server configuration in the client for that (see list_endpoints). Numbers are measured at call time, not editorially maintained. Scope: which classification trees and which attributes exist concretely is answered by list_facets and list_attributes -- here you only see whether calling them is worthwhile."
        arguments:
          endpoint_id: "Endpoint to describe (id from list_endpoints). Without it: this server's result space."
      get_schema:
        description: "Returns the OpenAPI schema of a content template (schema.org type), or without an argument the list of available templates. System prerequisite/scope: the schema is generated from the template definitions installed on this instance and describes what a type CAN carry -- not what actually occurs or is populated in an endpoint. A property documented here is neither necessarily filled nor filterable: list_templates says what the endpoint carries, list_attributes what is filterable."
        arguments:
          template: "ThingTemplate name or schema.org type (as in the route). Without it: the list of available templates."
      list_writable_attributes:
        description: "Lists the WRITABLE attributes of a template -- the discovery step for create_content/update_content, and the only reliable source of those names. Do NOT substitute get_schema or list_attributes: those describe the reading v4 api and return its api names, which are silently discarded when writing (an api name such as \"odta:length\" ends up in ignored_attributes, writing goes through the internal key \"length\"). Per attribute you get: \"attribute\" (the key for data), \"api_name\" (the same value in the reading api, to reconcile with get_schema/search_contents), \"type\", \"label\", \"unit\" (ALWAYS pass values in this unit -- length in m, not km), \"concept_scheme\" (for type classification the tree to resolve against via resolve_concepts/list_concepts), \"embedded_template\" (for embedded/linked the target template), \"translatable\" (kept per language), \"required\" (mandatory -- without it NOTHING is created) and \"recommended\". A \"creatable\" of false means the template cannot be created at all (embedded or not configured as creatable) -- create_content is not a route for that type."
      create_content:
        description: "Creates a NEW content (e.g. a tour as template \"Trail\"). WRITING tool: the record is persisted immediately, there is no preview or confirmation step and no undo -- the user must have explicitly asked for the record to be created, not merely talked about content. PROCEDURE, in this order: 1. Determine the template (list_templates on the endpoint server, get_schema without an argument instance-wide) -- the user's term is NOT the template name -- it may be called something else (a \"tour\" as \"Trail\", say) or not be a type of its own at all but a more general type plus a category facet. Which case applies here is decided by the discovery, not by assumption. 2. Call list_writable_attributes for exactly that template and take the attribute names from there; NEVER guess attribute names, carry them over from another template, or take them from get_schema/list_attributes -- those describe the READING api and return its api names (\"odta:length\", \"odta:uphillElevation\"), while writing goes through the internal keys (\"length\", \"ascent\"). An api name used as a key creates the record but discards the value. 3. Pass categories, difficulty, region and every other classification as an array of concept UUIDs resolved beforehand via resolve_concepts (endpoint server) or list_concepts (instance-wide) -- plain names are NOT resolved and end up as an ignored attribute. Those are the very ids that get written (facet_values returns them too), so NO id resolution of your own is required. \"data\" is a FLAT attribute hash in the language given by \"locale\"; splitting it into translatable and language-neutral attributes happens server-side. Check the response BEFORE reporting success, and name its contents to the user: \"ignored_attributes\" lists every given attribute the template does not know or that is not externally writable -- those were NOT saved (without that list the silent discard would have been reported as \"saved\"); \"applied_attributes\" lists the given attributes that were allowed to be written and \"changed_attributes\" the ones among them that actually changed (an attribute missing there already carried that value -- that is not an error and not to be retried); \"attribute_name_corrections\" names the correct internal key for an ignored api name where recognizable; \"warnings\" names missing recommended values; \"data_pool\" names the content pool: by template default a newly created content usually lands in the pool \"Entwurf\" (draft) and is therefore visible in NO public API endpoint -- a subsequent search for its title returns 0 hits, which is not an error. If a validation fails (e.g. missing title), NOTHING is created and the tool answers with an error listing the fields. Do not add further languages here, add them via update_content with a different locale."
        arguments:
          data: "Flat attribute hash; the keys are the attribute names from list_writable_attributes (NOT the api names from get_schema/list_attributes -- those are discarded). Classifications as an array of concept UUIDs (from resolve_concepts/list_concepts)."
          locale: "Language of the translatable attributes, e.g. \"de\". Default: the default language of the instance."
      update_content:
        description: "Changes attributes of an EXISTING content. WRITING tool: the change is persisted immediately and there is no undo -- the user must have explicitly asked for the change. Partial update: ONLY the attributes given in \"data\" are written, all others stay untouched; to clear an attribute, pass it explicitly with an empty value. Attribute names come from list_writable_attributes for the content's template (get_content names the template) -- NOT from get_schema or list_attributes: those return the reading api's names (\"odta:length\"), while writing goes through the internal keys (\"length\"), and an api name used as a key is discarded. Pass classifications as concept UUIDs from resolve_concepts/list_concepts. Those are the very ids that get written (facet_values returns them too), so NO id resolution of your own is required. \"locale\" selects the language of the translatable attributes; a language that does not exist yet is added as a further translation, existing translations are unaffected. Check the response BEFORE reporting success: \"applied_attributes\" names the given attributes that were allowed to be written, \"changed_attributes\" the ones among them that actually changed (an attribute missing there already carried that value -- that is not an error and not to be retried), \"ignored_attributes\" the silently discarded ones (unknown to the template or not externally writable) and \"warnings\" the notes about the write (among them \"no changes\"). If the response contains \"external_source\", the content is IMPORTED: the change will be overwritten by the next import run of that source unless the attribute is kept as an overlay -- tell the user instead of reporting the change as permanent. Embedded contents cannot be written directly, only through their parent content."
    # Definitions of the classification trees, delivered by list_facets, browse_concept_schemes and
    # facet_values. The key is the exact tree name (ConceptScheme#name).
    #
    # Purpose: the name alone does not tell an LLM which dimension a tree covers, how deep it is, or
    # what it does NOT contain. Guessing that is not detectably wrong -- the client filters on a
    # plausible tree, gets a plausible number and reports it without reservation. Each definition
    # therefore states: dimension, structure, coverage and the concrete pitfall.
    #
    # NO measured figures in these texts. The response carries the numbers itself: concept_count,
    # depth and thing_count per tree (Mcp::ConceptSchemeMetrics), plus the per-value thing_counts
    # from facet_values. Written along as prose they went stale with every import without a client
    # being able to see their age -- it read them as a current finding and passed them on. What is
    # left here is what cannot be measured: which dimension a tree covers, what it does NOT contain,
    # which values belong together for one user question. Where a ratio carries the point ("thinly
    # populated"), the text names the response fields that evidence it.
    #
    # A tree without an entry here simply carries no description field.
        arguments:
          id: "Content UUID (e.g. from create_content or search_contents)."
          data: "Flat attribute hash with ONLY the attributes to be changed, keys from list_writable_attributes (NOT the api names from get_schema/list_attributes -- those are discarded). Classifications as an array of concept UUIDs."
          locale: "Language of the translatable attributes, e.g. \"de\". A language that does not exist yet is added as a further translation. Default: the default language of the instance."
    sort:
      parameter: "Sorting of the result -- WITHOUT this parameter the order is the editorial default sorting (boost/updated_at) and limit returns an ARBITRARY subset. Every \"highest/longest/largest/nearest/newest N\" question MUST set it -- limit alone yields NO ranking, but a plausible wrong answer. Only ONE criterion (several is not possible in the query layer). The sorted value is included per hit as sort_value (with unit) in the result and is to be checked before reporting the ranking."
      attribute: "Sort key: a numeric attribute from list_attributes (e.g. \"odta:length\"), or \"dct:created\"/\"dct:modified\" (modification date), \"name\" (title alphabetically), \"distance\" (distance -- only together with near). Non-numeric attributes (date, text, boolean) are NOT sortable and return an error listing the permitted keys -- do not fall back to query or to sorting inside the client."
      direction: "asc = ascending (smallest/nearest/earliest value first), desc = descending. Default: desc for numbers and dates (\"the longest\", \"the newest\"), asc for name and distance."
    template_lookup:
      argument: "ThingTemplate name, e.g. \"Trail\" for a tour. Discovery: get_schema (without an argument) or list_templates."
    # Texts a tool returns as its RESULT when the question was answerable but the answer is empty --
    # an unknown template, an unknown id, an unresolvable place name. Deliberately NOT a tool error
    # (Mcp::ErrorMapper): the call succeeded, only the thing looked for does not exist, and an error
    # would be a reason for a client to retry.
    errors:
      unknown_template: "Unknown template \"%{template}\". get_schema without an argument (or list_templates) lists the available names."
      unknown_id: "The id %{id} matches neither a content nor a concept scheme, a concept or a schedule -- it is unknown or outside the visibility scope."
      unresolved_place: "The place name \"%{place}\" does not occur in any of the configured resolution trees (see searched_concept_schemes). The place filter therefore has no effect: a result count would be the unfiltered total and must NOT be reported as \"that many exist there\"."
    # Notices that travel in the response envelope's `warnings` rather than in the payload
    # (Tools::Base#warnings): they say the answer beside them rests on something that did not take
    # effect, which a client must see without knowing where in the payload to look.
    warnings:
      downsampled_series: "This series was thinned to %{returned} of %{total} points. Its SHAPE is intact, the individual points are not: do not report a minimum, a maximum, a sum or a single value from it, and do not count the points as measurements. For exact values narrow the range or aggregate it (the time and group_by arguments, where the tool offers them)."
      unresolved_concept_ids: "These passed concept ids match no concept and therefore filter NOTHING: %{ids}. The count beside this warning is the unfiltered set and must not be reported as the requested subset. Usually an id that names no concept (a content or scheme id, say) -- resolve_concepts returns the correct group per term, and applied_filters names the group each id was passed in."
      unresolved_place: "The place name \"%{place}\" resolved to nothing and therefore filters NOTHING. The count beside this warning is the unfiltered set and must not be reported as \"that many exist there\". resolve_place names the concept schemes that were searched; applied_filters.place carries the same finding."
    # Texts of the resolve_concepts response (Mcp::ConceptResolver) -- part of the result and
    # therefore here rather than in the tool description.
    concept_resolver:
      empty_group_warning: "classification_alias_id_group is EMPTY -- this term is not filterable in the trees checked. Do NOT pass the group to search_contents: an empty group filters nothing and the answer would be the endpoint's total, not the requested subset. That is also why this response carries no count. Either report it as \"the endpoint keeps no classification for this\", or check a non-curated tree found via browse_concept_schemes by passing concept_scheme_ids -- do NOT fall back to the query full text."
      # Why a variant that was found is NOT part of the group.
      excluded:
        redundant: "redundant: an ancestor is already in the group and pulls this node in via its subtree"
        empty: "empty in this endpoint"
    concept_schemes:
      "Administrative Einheiten":
        description: "Political/administrative hierarchy in four levels: country > state/canton > district > municipality. The tree resolve_place searches first for a place name. It is fully seeded and NOT derived from the contents: the vast majority of its concepts carry zero contents, so a name match does NOT prove that data exists for that place -- only facet_values (default min_count_with_subtree 1) or resolve_place settles that; the gap between concept_count and thing_count shows the ratio. Tourism region names (\"Montafon\", \"Bregenzerwald\") do NOT exist here; they live in \"Regionen Vorarlberg\". For place filters prefer resolve_place over this tree: a plain classification facet misses every content without a tree assignment, which is locatable only through its address."
      "Regionen Vorarlberg":
        description: "Vorarlberg's tourism hierarchy rather than its administrative one, three levels and only few concepts: under the root \"Tourismusdestination\" the six destinations (Alpenregion Vorarlberg, Bodensee-Vorarlberg, Bregenzerwald, Kleinwalsertal, Lech Zürs, Montafon), under the root \"Sonstige\" four smaller associations (amKumma, Bödele, Im Walgau, Witus), and below those individual places and ski areas (Bludenz, Brand, Lünersee, Skigebiet Golm, ...). The most densely populated region tree of this instance. Not a competitor to \"Administrative Einheiten\" but a different dimension: users usually name the destination, which does not exist there at all. A destination is a parent node -- without include_subtree the filter only matches contents attached directly to it, not those of its places."
      "Kategoriebaum Vorarlberg - POI 2022":
        description: "Subject category of POIs (mostly TouristAttraction/Place) under 16 root branches: Banken, Bauwerke und Gebäude, Behörden, Dienstleistungen, Einkaufen und Handel, Freizeit, Fremden- und Freizeitführer, Gesundheit, Kunst und Kultur, Mobilität und Verkehr, Natur-Sehenswürdigkeiten, Notdienste, Öffentliche Einrichtungen, Sport, Touristische Einrichtungen, Verleihe. IMPORTANT, what is missing: the tree has NO gastronomy branch -- restaurants, cafés and bars live exclusively in \"Kategoriebaum Vorarlberg - POI Gastronomie\". Looking for gastronomy here finds nothing and leads to the false conclusion that the instance holds none."
      "Kategoriebaum Vorarlberg - POI Gastronomie":
        description: "Type of gastronomy business, a flat list: Restaurant, Gasthaus / Wirtshaus, Café, Bar & Pub, Bergrestaurant, Jausenstation, Konditorei, Pizzeria, Vinothek, Skihütte & Aprés Ski, Haubenlokal, Alpwirtschaft, Käserei / Sennerei, Hofladen, Brauerei, Bier-/Gastgarten, Buffet / Imbiss / Fastfood, Eisdiele / Eissalon, Heuriger / Buschenschank, Nachtclub / Diskothek / Tanzlokal, Rasthaus / Autobahnraststätte, Sonstiger Gastronomiebetrieb. The only gastronomy dimension of this instance -- \"Kategoriebaum Vorarlberg - POI 2022\" has no branch for it. Crucially: gastronomy here is mostly NOT modelled as the FoodEstablishment template but as TouristAttraction plus a value from this tree. A question about restaurants must therefore be answered through this tree, not through template_names."
      "Feratel - Infrastrukturklassifizierungen":
        description: "A catch-all tree from the Feratel import that mixes eight dimensions in one: Essen & Trinken (food & drink), Infrastruktur, Kunst & Kultur, Mobilität & Verkehr, Routen & Touren, Sehenswürdigkeiten, Sport & Freizeit, Wellness & Gesundheit. Despite its uninformative name it carries the cuisine/diet dimension (\"vegan\", \"vegetarian\", \"regional cuisine\"), which is why it is curated despite its fuzziness. It carries it for GASTRONOMY only, though: it classifies TouristAttraction exclusively. The same attributes for accommodations live in \"Feratel - Merkmale - Unterkünfte\" and \"Feratel - Merkmale - Nachhaltigkeitskriterien\" (neither curated, both reachable via browse_concept_schemes), and the three trees do not overlap at the level of an individual business. A question about vegetarian/vegan BUSINESSES must therefore go through resolve_concepts, which searches all trees -- filtered on this tree alone the accommodations are missing silently, and they are the larger part of the stock. Two structural traps: (1) below the roots sit pseudo nodes of the form \"<root> |> Rubrik1\"/\"Rubrik2\", with the actual values only underneath -- a filter on a root needs include_subtree or it matches almost nothing. (2) The values are uncleaned and full of near-duplicates sitting side by side (Bar, Bar / Cafe, Bar/Pub/Lounge, Bar-Restaurant; Café, Cafe & Konditorei, Café-Restaurant), which for one user question belong together in ONE classification_alias_id_groups group."
      "Feratel - Unterkunftsarten":
        description: "Type of lodging business (LodgingBusiness), a flat list: Hotel, Hotel Garni, Aparthotel, Berghotel / Berggasthof, Gasthof, Pension, Frühstückspension, Privatzimmer, Bed & Breakfast, Ferienwohnung / Appartement (by far the largest value), Ferienhaus, Chalet, Bauernhof, Campingplatz, bewirtschaftete Hütte, Hütte / Schutzhütte, Jugendherberge, Hostel, Gruppenunterkunft, Selbstversorgerhaus, Reiterhof, Schlafen im Stroh and more. Three quirks: (1) several values exist multiple times under the same name -- \"Chalet\" exists as three concepts, only one of which carries contents while the others are empty; check the thing_counts from facet_values before filtering and put all populated variants into ONE group. (2) Overlapping pairs such as Privatzimmer / \"Privatzimmer / Bed & Breakfast\" or Frühstückspension / \"Frühstückspension / Privatzimmer\" mean the same thing for a user question. (3) The tree is not dimensionally clean: \"Sommer Bergbahnticket Inklusive\" is an offer feature, not a type of business. Comfort/rating lives in \"Feratel - Sterne\", amenities in \"Feratel - Merkmale - Unterkünfte\" (not curated, reachable via browse_concept_schemes)."
      "Feratel - Sterne":
        description: "Star rating of lodging businesses, a flat list: 1 to 5 stars, each also as \"... Superior\". Thinly populated -- only a small share of the accommodations carries a rating at all; this tree's thing_count set against that of \"Feratel - Unterkunftsarten\" shows the gap. Filtering on stars therefore excludes the large majority of accommodations because they are unrated, not because they fail the rating; mention that when reporting a count. \"4 Sterne\" and \"4 Sterne Superior\" are separate concepts: a question about \"4 stars\" almost always means both, and \"at least 4 stars\" means all four concepts from 4 stars upwards."
      "Feratel - Merkmale - Unterkünfte":
        description: "Amenity and offer attributes of accommodations (LodgingBusiness) from the Feratel import; not curated, reachable via browse_concept_schemes. Despite the name it is not only amenities: the tree also carries the cuisine/diet dimension for accommodations -- \"Vegetarische Küche\", \"Vegane Küche\", \"Regionale Küche\" live HERE and not in a gastronomy tree. That dimension is split across three trees by kind of business: gastronomy in \"Feratel - Infrastrukturklassifizierungen\", accommodations here and in \"Feratel - Merkmale - Nachhaltigkeitskriterien\"; the gastronomy and accommodation sets do not overlap. A question about vegetarian/vegan BUSINESSES must therefore go through resolve_concepts, which searches all trees -- filtered on one of these trees alone, the other kind of business is missing silently. Second trap: the tree classifies not only LodgingBusiness but, to a far greater extent, Offer (package deals) and also Event -- without template_names any facet from it counts offers too, and the number is not a count of businesses."
      "Feratel - Merkmale - Nachhaltigkeitskriterien":
        description: "Sustainability attributes of accommodations (LodgingBusiness) and events (Event) from the Feratel import; not curated, reachable via browse_concept_schemes. Thinly populated, yet indispensable for the cuisine/diet dimension: \"Auswahl an vegetarischen und veganen Speisen und Getränken\" lives here and in no other tree. A substantial share of the accommodations marked this way carry ONLY this attribute and are therefore missing from any number derived from \"Feratel - Merkmale - Unterkünfte\" or \"Feratel - Infrastrukturklassifizierungen\" alone -- resolve_concepts collects all three trees together. The attributes are editorially maintained and not comprehensive: a low hit count here means \"not flagged\", not \"not available\"."
      "Feratel - Urlaubsthemen":
        description: "Topic and marketing tags from the Feratel import, a flat list and the most broadly populated topic tree of this instance. Deliberately heterogeneous and NOT to be read as a clean taxonomy: genuine holiday topics (Aktiv, Adventure, Angeln & Fischen, Am Berg) sit next to packages (All Inclusive, Arlberg Weinberg 3 Tage, Almliesl Deluxe), place references (Almtal, Ausflugsziele Brandnertal, Alpines Wipptal) and pure booking attributes (2Raum, 3Raum, auf Anfrage, Always On). Usable as a topic facet, not as a taxonomy: inspect the actual values via facet_values before filtering instead of inferring a concept's meaning from its name."
      "Bergfex - Schnee - Meldung":
        description: "Slope condition from the Bergfex snow report, a flat list: single conditions (Pulver, Sulz, hart, Nassschnee, Altschnee, Kunstschnee, griffig, eisig-hart, weich-nass, stellenweise aper), pairwise combinations (Pulver-Sulz, hart-nass, Sulz-Pulver, nass-hart, ...) and \"keine Meldung\". Only few contents carry a value: the tree describes reported ski areas/slopes, not the winter sports offering as a whole -- a low count is the norm here and not a filtering mistake. Because the same condition appears both as a standalone value AND as part of several combinations, a question about \"powder snow\" covers every concept whose name contains \"Pulver\", not just the identically named one; those belong together in ONE classification_alias_id_groups group. The values are daily reports and therefore volatile."
      "Veranstaltungskategorien":
        description: "Subject category of events (Event) under 23 root branches: Musik, Sport, Theater, Tanz | Ballett, Kunst, Architektur, Ausstellung | Messe, Film | Kino, Literatur, Kurs, Vortrag | Kongress | Symposium | Seminar, Kulturfestival | Festspiele, Fest | Party | Unterhaltung, Kulinarik | Markt | Genuss, Brauchtum | Tradition | Volkskultur, Religiöse Veranstaltungen, Kinder | Jugend | Familie, Senioren, Erholung | Vitalität | Gesundheit | Wellness, Führungen | Fahrten | Touren, Bildungsangebot Tourismus, Veranstaltungsreihe, Sonstige Veranstaltungen. The curated category tree for events. Note: many names are \"|\"-joined synonym groups, so a user's term often does NOT sit at the start of the name (\"Wellness\" is inside \"Erholung | Vitalität | Gesundheit | Wellness\", \"Markt\" inside \"Kulinarik | Markt | Genuss\"). Match a term against the whole name, not against its beginning."
      "ODTA - Schwierigkeitsgrade":
        description: "Difficulty of tours (Trail), only three values: Leicht, Mittel, Schwer. Almost fully populated and therefore the most reliable filter in this area. Beware the duplicate: the non-curated tree \"Schwierigkeitsgrad (Trail/Tour)\" covers the same dimension and carries the same number of contents -- comparing the thing_counts of both trees shows it. One of the two suffices; filtering on both as separate AND groups does not narrow the result further, it only complicates it. \"OutdoorActive - Schwierigkeitsgrad\" also exists but carries no contents (thing_count 0) and has no effect."
      "ODTA - Tourenkategorien":
        description: "Type of tour (Trail) under eight root branches: Wandern (hiking), Bergsteigen (mountaineering), Radfahren (cycling), Winter, Wassersport, Reiten, Gehen und Skaten, Motorisierte Tour. Two levels -- the actual tour types sit below the roots, e.g. under \"Bergsteigen\": Bergtour, Alpintour, Hochtour, Klettersteig, Alpinklettern, Eisklettern. This is exactly where include_subtree is dangerous: a parent node pulls in its whole subtree, and \"hiking\" is not the same as \"Bergsteigen\", which brings along via ferratas and ice climbing. If a user's term covers only part of a branch, pass the matching child nodes individually instead of the parent."
    scope:
      # Value for the %{endpoint_name} interpolation of the shared tool descriptions on the global
      # mount, which has no endpoint name (see Servers::GlobalServer#tool_description_options).
      global: "\"instance-wide\" (no endpoint scope: every content the calling user is allowed to see via the API -- facets and totals are correspondingly broad, for a curated view use list_endpoints and the respective endpoint server)"
    resources:
      schema_index:
        description: "List of content templates (schema.org types) whose schema is available via schema_template -- within an endpoint scope, only the templates actually present there. System prerequisite: within an endpoint scope the list is counted from the contents (like list_templates), instance-wide it comes from the installed template definitions -- so depending on the server, the same list means either data coverage or installation state."
      schema_template:
        description: "The OpenAPI schema of a single content template (schema.org type), from schema_index. Same system prerequisite/scope as get_schema: generated from the installed template definition -- it describes the type's possible field inventory, not how well it is populated in the endpoint."
