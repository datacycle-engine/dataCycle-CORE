de:
  mcp:
    # Server instructions (Mcp::ServerInstructions): the only text a client sees BEFORE its first
    # tool call -- initialize/server/discover deliver it, tools/list does not.
    #
    # What belongs here is ONLY what holds mount-wide and cannot sit in any single tool description:
    # which result space applies, which language is used, in what order to work, how to report a
    # number, and whether writing is allowed. The per-tool detail lives in mcp.tools.* -- do NOT
    # repeat it here, or the two versions drift apart and a client ends up with two manuals whose
    # contradiction it cannot resolve.
    #
    # Assembled in this order: <endpoint|global>, language, workflow, reporting,
    # <write_enabled|read_only>. A client that truncates the text therefore loses the optional part
    # first and not the result space.
    instructions:
      endpoint: "Dieser Zugang liefert die Inhalte des Endpoints \"%{endpoint_name}\" -- eine kuratierte Teilmenge der Instanz, nicht ihren Gesamtbestand. Jede Zahl aus diesen Tools gilt für diese Teilmenge: \"gibt es nicht\" heißt hier immer \"in diesem Endpoint nicht\" und ist dem Nutzer gegenüber so zu formulieren."
      global: "Dieser Zugang liefert alle Inhalte, die der aufrufende Nutzer über die API sehen darf -- kein Endpoint-Scope. Facetten und Gesamtzahlen sind entsprechend breit und mischen Bestände, die inhaltlich nichts miteinander zu tun haben. Für eine kuratierte Sicht list_endpoints aufrufen und mit dem Endpoint-Zugang weiterarbeiten."
      language: "Sprache dieser Sitzung: %{session_locale} (verfügbar: %{available_locales}). Tools ohne ausdrückliches locale-Argument arbeiten in %{session_locale}; das gilt auch für die Sprache, in der geschrieben wird."
      workflow: "Vorgehen, in dieser Reihenfolge: erst die vorhandenen Strukturen ansehen (list_facets und facet_values für Klassifikationen, list_attributes für Attribute, list_templates bzw. get_schema für Inhaltstypen), dann strukturiert filtern. Kategorien, Themen, Regionen, Betriebsarten und Schwierigkeitsgrade sind IMMER Klassifikationen und nie Volltext; die Volltextsuche ist der letzte Ausweg für wörtliche Zitate und Eigennamen. Der Begriff des Nutzers ist nicht der Begriff des Datenmodells -- ihn vor dem Filtern auflösen (resolve_concepts, resolve_place, facet_values) statt ihn zu raten."
      reporting: "Vor dem Berichten einer Zahl: applied_filters der Antwort lesen und den tatsächlich angewendeten Filter mitnennen. Eine leere Liste ist NICHT automatisch ein Datenbefund -- sie kann auch heißen, dass eine Systemvoraussetzung dieser Instanz nicht erfüllt ist (Feature nicht aktiviert, nichts für die API freigegeben, abgeleitete Struktur nicht vorhanden). Die Tool-Beschreibungen nennen unter \"Systemvoraussetzung(en)\", woran der Unterschied erkennbar ist; er gehört in die Antwort an den Nutzer, statt als \"existiert nicht\" berichtet zu werden."
      read_only: "Dieser Zugang ist NUR LESEND: es gibt keine Tools, die Inhalte anlegen oder ändern. Eine Änderungsbitte ist als hier nicht möglich zu beantworten und nicht durch einen Lese-Aufruf zu ersetzen."
      write_enabled: "Dieser Zugang kann auch SCHREIBEN (create_content, update_content). Beides persistiert sofort und hat kein Undo: nur aufrufen, wenn der Nutzer das Anlegen oder Ändern ausdrücklich verlangt hat, nicht wenn er bloß über Inhalte gesprochen hat. Vor dem Melden eines Erfolgs ignored_attributes und warnings der Antwort prüfen und benennen."
    # Where they exist, tool descriptions end with a "System prerequisite(s):" paragraph. It states
    # what must hold ON THE SYSTEM before the tool -- or a single argument -- can have any effect:
    # enabled features, instance-specific configuration, API visibility releases, derived structures
    # (full-text index, materialized views) and data facts such as geometry or time series.
    #
    # Purpose: an unmet system prerequisite looks like a finding about the data. The filter is
    # silently not applied or the list comes back empty, the answer is plausible, and the client
    # reports "there is none" where "not configured/not released here" would be correct. These
    # paragraphs make that distinction decidable for the client and name the signal it can check
    # (resolved false, an empty list, a specific error message).
    # Prompts (Mcp::Prompts::*): entry points the USER picks in the client -- the third way this
    # server offers context, next to the instructions (always apply) and the tool descriptions
    # (apply per tool).
    #
    # DELIBERATELY THIN. The procedure lives in mcp.instructions and is referenced here, not
    # repeated; what is left is only what distinguishes THIS task from any other question. Kept
    # as a second version of the same manual, the two would drift apart and a client would end up
    # with two procedures whose contradiction it cannot resolve.
    prompts:
      inventory_question:
        description: "Eine Frage nach dem Bestand beantworten (\"wie viele\", \"welche\", \"gibt es\") -- mit dem Filter, aus dem die Zahl stammt."
        message: "Beantworte diese Frage nach dem Bestand: %{question}\n\nHalte dich an das in den Server-Instructions beschriebene Vorgehen und beachte zusätzlich: (1) Löse jeden Begriff der Frage einzeln auf, bevor du filterst -- ein Begriff liegt oft als mehrere Concepts vor, und eine unvollständige Auswahl liefert eine plausible, aber zu niedrige Zahl. (2) Bedingungen, die GLEICHZEITIG gelten sollen, gehören in getrennte UND-Gruppen und nicht in eine gemeinsame Liste. (3) Schalte explain ein, wenn du eine Zahl berichtest oder vergleichst. (4) Nenne im Ergebnis den tatsächlich angewendeten Filter aus applied_filters, nicht nur die Zahl -- und sage dazu, worauf sie sich bezieht."
        arguments:
          question: "Die Frage des Nutzers, wörtlich."
      write_content:
        description: "Einen Inhalt anlegen oder ändern -- mit Prüfung, was tatsächlich gespeichert wurde."
        message: "Führe diese Änderung am Datenbestand aus: %{intent}\n\nHalte dich an das in den Server-Instructions beschriebene Vorgehen und beachte zusätzlich: (1) Bestimme zuerst das Template und hole die Attributnamen aus list_writable_attributes -- NICHT aus get_schema oder list_attributes, deren API-Namen beim Schreiben verworfen werden. (2) Klassifikationen als aufgelöste Concept-UUIDs übergeben, nie als Klartext. (3) Prüfe die Antwort VOR jeder Erfolgsmeldung: ignored_attributes nennt, was still verworfen wurde, changed_attributes das tatsächlich Geänderte, warnings die fehlenden Pflichtangaben. (4) Berichte, was NICHT gespeichert wurde, genauso deutlich wie den Erfolg."
        arguments:
          intent: "Was angelegt oder geändert werden soll, in eigenen Worten."
    tools:
      search_contents:
        description: "Strukturierte Suche innerhalb des Endpoints %{endpoint_name}. STRUKTURIERT FILTERN, NICHT VOLLTEXT-SUCHEN: Kategorien/Typen/Themen IMMER über Klassifikations-Facetten (list_facets -> facet_values -> classification_alias_ids bzw. exclude_classification_alias_ids für \"alles außer\", wahlweise inkl. Subtree via include_subtree), Werteinschränkungen über attributes (list_attributes liefert Namen/Typen, z.B. \"Preis < 20\"), Umkreis über near, Zeiträume über schedule, Vorhandensein/Fehlen einer Relation über has_relations/missing_relations. Mehrere Facetten, die GLEICHZEITIG gelten müssen (Schwierigkeit UND Region UND Kategorie), gehören in classification_alias_id_groups -- eine Gruppe je Bedingung; in einer gemeinsamen classification_alias_ids-Liste werden sie ODER-verknüpft und liefern mehr statt weniger Treffer. Umgekehrt gehören ALLE Concept-Varianten EINER Bedingung in DIESELBE Gruppe: Importquellen liefern denselben Sachverhalt oft als mehrere UUIDs (gleichlautend oder synonym), und nur eine davon zu filtern liefert eine plausible, aber zu niedrige Zahl. Diese Gruppen NICHT selbst zusammenstellen: resolve_concepts liefert je Begriff die fertige Gruppe. Der Parameter query ist NUR für echten Freitext gedacht (wörtliches Zitat, Eigenname, den der Nutzer so gesucht hat) und ist der LETZTE Ausweg -- vor jeder Nutzung von query zuerst list_facets/facet_values bzw. list_attributes aufrufen und prüfen, ob sich die Anfrage strukturiert abbilden lässt. Niemals Template-/Typnamen (z.B. \"TouristAttraction\"), Kategorienamen oder Ortsnamen als query übergeben: Typen gehören in template_names (Discovery: list_templates), Kategorien und Orte in Facetten -- als query liefern sie entweder 0 Treffer, obwohl passende Inhalte existieren, oder eine viel zu große Menge quer über alle Typen. Ein Kategoriename als query trifft typischerweise ein Mehrfaches der strukturierten Entsprechung, weil er auch jeden Inhalt einsammelt, der das Wort nur in der Beschreibung erwähnt (Unterkünfte, Berichte); wie groß der Unterschied im konkreten Bestand ist, zeigt derselbe Aufruf einmal mit query und einmal mit template_names + Kategorie-Facette, jeweils mit explain: true. Die Antwort enthält neben count/items ein applied_filters mit dem AUFGELÖSTEN Filter: Concept-Namen je UND-Gruppe, die per include_subtree zusätzlich eingeschlossenen Concepts (subtree_concepts, gekürzt auf eine Stichprobe, subtree_concept_count nennt die Gesamtzahl), die Einheit der Attributfilter und unresolved_ids für übergebene UUIDs ohne Concept (die filtern nichts -- meist eine mit der Classification-ID verwechselte Alias-ID). Vor dem Berichten einer Trefferzahl gegen applied_filters prüfen, ob genau die gemeinte Menge gefiltert wurde, und die verwendeten Kategorien in der Antwort benennen: dieselbe Frage lässt oft mehrere vertretbare Concept-Zuordnungen zu, und eine Zahl ohne genannten Filter ist nicht nachvollziehbar. Wird die Zahl berichtet oder mit einer anderen Quelle verglichen, zusätzlich explain: true setzen -- applied_filters.explain nennt dann die Trefferzahl nach JEDEM Filterschritt und zeigt, welche Bedingung wie viel wegnimmt. Eine Frage nach den \"größten/längsten/nächstgelegenen/neuesten N\" MUSS sort setzen: ohne sort gilt die redaktionelle Standardsortierung, und limit liefert eine BELIEBIGE Teilmenge -- als Rangliste berichtet ist das eine plausible Falschantwort. Der sortierte Wert steht dann je Treffer als sort_value (mit sort_unit) im Ergebnis und ist vor dem Berichten zu prüfen; ist ein Schlüssel nicht sortierbar, nennt der Fehler die zulässigen -- nicht auf query oder eine Sortierung im Client ausweichen. Systemvoraussetzungen der einzelnen Filter -- ein nicht erfüllter Filter bleibt überwiegend STILL wirkungslos, statt zu scheitern: place braucht das aktivierte mcp-Feature mit eingeschalteter Geo-Kaskade (mcp.geo.enabled) samt mindestens einem konfigurierten Auflösungsbaum (das Gem liefert nur den administrativen Baum mit, jeder weitere ist instanzspezifisch) -- fehlt beides, meldet applied_filters.place.resolved false und die Zahl ist die ungefilterte Endpoint-Menge. attributes wirkt nur mit Namen aus list_attributes (Properties, die in der Template-Definition advanced_search tragen): ein dort unbekannter Name bricht mit \"attribute is unknown\" ab, ein existierender, aber nicht als advanced_search konfigurierter Property-Name wird dagegen still übergangen und liefert eine plausible, in Wahrheit ungefilterte Zahl. near setzt Koordinaten am Inhalt voraus und übergeht die Inhalte mit latitude/longitude 0/0, die nur über ihre Adresse verortbar sind -- für \"in <Ort>\" deshalb place statt near. schedule trifft nur Inhalte mit Terminen (Event-Occurrences); template_names und die Facetten-Argumente haben keine eigene Systemvoraussetzung, ihre Discovery (list_templates, list_facets/facet_values) zeigt bereits den real vorhandenen Bestand."
        arguments:
          query: "LETZTER AUSWEG -- nur echter Freitext (wörtliches Zitat, Eigenname). Kategorien/Typen/Themen stattdessen über classification_alias_ids (list_facets/facet_values), Werte über attributes (list_attributes), Orte über place (Umkreis um einen Punkt: near), Zeiträume über schedule. Template-/Typnamen (z.B. \"TouristAttraction\"), Kategorie- und Ortsnamen hier NICHT übergeben -- sie liefern 0 Treffer, obwohl passende Inhalte existieren."
          template_names: "Nur Inhalte dieser Content-Templates (schema.org-Typen), ODER-verknüpft -- verfügbare Namen samt Anzahl via list_templates. Typ und Kategorie sind VERSCHIEDENE Dimensionen: der Typ steht hier, die Kategorie (\"Restaurant\", \"Hotel\") in den Klassifikations-Facetten. Fragt der Nutzer nach einem Typ (\"Restaurants (FoodEstablishment)\"), BEIDES prüfen -- derselbe Sachverhalt ist je Instanz unterschiedlich modelliert (Gastronomie z.B. als TouristAttraction + Kategorie, nicht als FoodEstablishment). Ohne diesen Filter kann eine Kategorie-Facette aus einem Baum, der mehrere Typen klassifiziert, Inhalte anderer Typen mitzählen (z.B. Unterkünfte mit Gastronomie-Kategorie)."
          classification_alias_ids: "Nur Inhalte, die MINDESTENS EINER dieser Klassifikations-Alias-UUIDs zugeordnet sind (positive Facette, ODER-verknüpft). NUR für eine einzige Bedingung verwenden. Sobald mehrere Facetten gleichzeitig gelten sollen (z.B. Schwierigkeit UND Region UND Kategorie), gehören sie in classification_alias_id_groups -- in einer gemeinsamen Liste würden sie ODER-verknüpft und die Treffermenge wäre größer statt kleiner. UUIDs siehe list_facets/facet_values."
          classification_alias_id_groups: "Mehrere positive Facetten-Bedingungen: innerhalb einer Gruppe ODER, zwischen den Gruppen UND. Eine Gruppe pro Bedingung bzw. pro Klassifikationsbaum, z.B. [[<mittel>], [<Vorarlberg>], [<Wandern>, <Bergsteigen>]] für \"mittel UND in Vorarlberg UND (Wandern ODER Bergsteigen)\". Kombinierbar mit classification_alias_ids (wirkt als weitere UND-Gruppe). Die Gruppe je Bedingung nicht selbst zusammenstellen, sondern von resolve_concepts holen (classification_alias_id_group) -- ein Begriff liegt oft als mehrere UUIDs vor, und eine unvollständige Gruppe liefert eine plausible, aber zu niedrige Zahl."
          exclude_classification_alias_ids: "Inhalte, die MINDESTENS EINER dieser Klassifikations-Alias-UUIDs zugeordnet sind, werden AUSGESCHLOSSEN (negative Facette, z.B. \"alles außer Kategorie X\")."
          include_subtree: "Ob Unterkategorien (Subtree) der angegebenen Klassifikationen mitzählen. Gilt für classification_alias_ids und exclude_classification_alias_ids. Default true; false = nur exakt die genannten Concepts."
          schedule: "Zeitraum-Filter auf Event-Occurrences. Absolut: {\"from\": \"2026-07-21\", \"until\": \"2026-07-28\"}. Relativ: {\"from\": {\"n\": 0, \"unit\": \"day\", \"mode\": \"p\"}, \"until\": {\"n\": 1, \"unit\": \"week\", \"mode\": \"p\"}}."
          place: "Ortsname für einen administrativen Geo-Filter (\"in Vorarlberg\", \"in der Gemeinde Egg\") -- exakter Concept-Name, Auflösung/Abdeckung vorab via resolve_place. NICHT über classification_alias_ids abbilden: dort trifft nur die Baum-Zuordnung, und Inhalte ohne Baum-Zuordnung fehlen still im Ergebnis -- je nach Bestand ein erheblicher Teil. Dieser Filter fällt pro Inhalt automatisch auf geo_regions bzw. die Adresse zurück. Ist der Name nicht auflösbar, greift KEIN Geo-Filter und die Trefferzahl ist die Gesamtmenge des Endpoints -- erkennbar an applied_filters.place.resolved = false. Mit welcher Quelle die Treffer zugeordnet wurden, nennt applied_filters.place.coverage bei explain: true (siehe dort). Für Umkreissuchen stattdessen near."
          near: "Geo-Umkreis-Filter um einen PUNKT. Liefert nur Inhalte innerhalb von radius_km um lat/lon. Für \"in <Ort>\" stattdessen place."
          attributes: "Strukturierte Attribut-Filter statt Volltext (z.B. \"Preis < 20\"). Attributnamen + Typen via list_attributes. Kombinierbar mit Facetten/Geo/Zeitraum. Je Bedingung ist in ODER not_in PFLICHT -- ein Eintrag mit bloßem attribute filtert nichts und wird abgewiesen."
          has_relations: "Nur Inhalte, die JEDE dieser Relationen gesetzt haben (Relationsname, z.B. \"image\")."
          missing_relations: "Nur Inhalte, denen JEDE dieser Relationen fehlt (Relationsname, z.B. \"image\" für \"kein Foto hinterlegt\")."
          limit: "Max. Anzahl Ergebnisse"
          explain: "Schaltet die Diagnose-Angaben der Antwort ein: applied_filters.explain protokolliert die kumulative Trefferzahl NACH jedem einzelnen Filterschritt (Endpoint-Gesamtmenge, dann je Facetten-Gruppe, Attributfilter, Zeitraum, Geo, Relationen) und zeigt, welche Bedingung wie viel wegnimmt; bei gesetztem place kommt applied_filters.place.coverage dazu, die Trefferzahl je Quelle der Geo-Kaskade (Klassifikationsbaum / geo_regions / Adresse) -- eine überwiegend aus der Adresse getragene Zahl ist schwächer belegt als eine aus dem Baum. Damit ist eine überraschende oder von einer anderen Quelle abweichende Trefferzahl auf einen Schritt eingegrenzt. Bei jeder Zahl einzuschalten, die berichtet oder mit einer anderen verglichen wird; sonst weglassen (jeder Schritt und jede Kaskadenstufe kostet ein eigenes COUNT)."
          attribute_condition:
            attribute: "api_name des Attributs (siehe list_attributes)."
            in: "Bedingung: min = >=, max = <= (Zahl oder Datum), equals = exakt, like = enthält (Text), bool = Boolean. Mehrere Schlüssel = UND."
            not_in: "Wie \"in\", aber negiert (z.B. not_in.equals = ungleich)."
      get_content:
        description: "Lädt einen einzelnen Content per ID innerhalb des Endpoints %{endpoint_name} (nur Contents, die im Endpoint sichtbar sind). Systemvoraussetzung: die Sichtbarkeit richtet sich nach den Filtern DIESES Endpoints. Eine ID, die aus einer anderen Quelle stammt (universal_lookup, ein Link), kann hier unauffindbar sein, obwohl der Inhalt existiert -- das ist eine Scope-Frage und als solche zu berichten."
      suggest:
        description: "Autocomplete-Wortvorschläge innerhalb des Endpoints %{endpoint_name} (Volltext-Wortstatistik). Für Eingabe-Vervollständigung in einer UI, NICHT zum Filtern oder als Ersatz für search_contents -- Kategorien/Typen/Orte über list_facets/facet_values auflösen. Systemvoraussetzung: der Volltext-Index (searches) in der angefragten Sprache. Er entsteht je Übersetzung beim Speichern bzw. Import eines Inhalts -- für eine Sprache ohne Index kommt eine leere Vorschlagsliste zurück, obwohl der Endpoint Inhalte führt. Eine leere Antwort ist hier also kein Datenbefund: vor dem Berichten mit der gepflegten Sprache (locale) gegenprüfen."
        arguments:
          locale: "Sprache, default %{default_value}"
      suggest_by_title:
        description: "Autocomplete-Titelvorschläge innerhalb des Endpoints %{endpoint_name} (Content-Titel-Ähnlichkeit). Nur wenn der Nutzer einen konkreten Titel sucht; keine Kategorie-, Typ- oder Ortsauflösung (dafür list_facets/facet_values). Systemvoraussetzung: derselbe Volltext-Index (searches) wie bei suggest, hier über die Titelzeile je Übersetzung. Fehlt der Index für die angefragte Sprache, ist die Liste leer, ohne dass der Titel fehlt."
        arguments:
          locale: "Sprache, default %{default_value}"
      list_facets:
        description: "Listet die für den Endpoint %{endpoint_name} relevanten Concept Schemes (Klassifikationsbäume) -- zur Vorbereitung von facet_values. ACHTUNG, das ist eine KURATIERTE Auswahl, keine vollständige Liste: pro Dimension wird bewusst nur ein Baum geführt, damit die Facetten für einen Client lesbar bleiben. Fehlt hier eine ganze DIMENSION (z.B. Küche/Ernährung, Ausstattung), heißt das NICHT, dass der Endpoint keine solchen Daten hat -- der Baum kann nur nicht kuratiert sein. In diesem Fall browse_concept_schemes (OHNE search, denn kein Baum ist nach der Dimension benannt) am instanzweiten Server aufrufen, den passenden Baum in der vollen Liste identifizieren und dessen ID trotzdem an facet_values bzw. dessen Concepts an search_contents übergeben -- beides akzeptiert auch nicht kuratierte Bäume. Jeder Eintrag trägt ein description-Feld, sofern für den Baum eine Definition hinterlegt ist: welche Dimension er abbildet, wie er strukturiert ist, wie gut er belegt ist und was er NICHT enthält. Diese Definitionen VOR der Auswahl eines Baums lesen -- die Namen allein sind irreführend -- ein Baumname nennt oft nicht die Dimension, die er tatsächlich trägt, und schweigt über die, die er NICHT enthält. Eine Auswahl nach Namen ist plausibel und trotzdem falsch. Fehlt das Feld, ist der Baum nicht dokumentiert -- dann die Werte über facet_values ansehen, statt die Bedeutung aus dem Namen abzuleiten. Systemvoraussetzungen: die kuratierte Auswahl ist die Facetten-Konfiguration des Endpoints (StoredFilter). Ist am Endpoint keine hinterlegt, leitet das Tool die Bäume stattdessen aus den Inhalten des Endpoints ab -- dann erscheinen nur Bäume, die für die API freigegeben und nicht als intern markiert sind. Diese Freigabe gilt systemweit und auch für browse_concept_schemes/list_concepts: ein nicht freigegebener Baum ist über MCP überhaupt nicht sichtbar, obwohl Inhalte an ihm hängen und seine Concepts in den Daten stehen. Fehlt eine Dimension also in BEIDEN Listen, ist das eine Freigabe-/Konfigurationsfrage an die Instanz und keine Aussage über die Daten."
      facet_values:
        description: "Zeigt die Klassifikations-Werte (Concepts) samt Content-Anzahl innerhalb eines Trees für den Endpoint %{endpoint_name} (siehe list_facets für verfügbare Trees, funktioniert aber auch für nicht kuratierte Bäume aus browse_concept_schemes). Standardmäßig nur Concepts mit mindestens einem Inhalt: taucht ein vom Nutzer genannter Ort, eine Region oder Kategorie INNERHALB eines Baums nicht auf, der diese Dimension abbildet, deckt der Endpoint sie nicht ab -- das ist als \"keine Daten zu dieser Region\" zu berichten und nicht per Volltextsuche zu umgehen. Diesen Schluss NUR ziehen, wenn ein Baum der passenden Dimension tatsächlich geprüft wurde: fehlt die Dimension in list_facets ganz, ist das eine Kuratierungslücke und KEIN Datenbefund -- dann erst über browse_concept_schemes (ohne search) und list_concepts (mit search) am instanzweiten Server den Baum suchen. Ob das Concept überhaupt existiert, klärt list_concepts (mit search) am instanzweiten Server. Jeder Wert trägt parent_id (nil bei Wurzelknoten) und is_leaf, die Liste ist also ein Baum -- das VOR dem Filtern auswerten: ein Elternknoten zieht mit include_subtree seinen gesamten Subtree mit, also auch Geschwisterkategorien, die der Nutzerbegriff nicht meint (Beispiel: unter \"Bergsteigen\" hängen neben \"Bergtour\" auch \"Klettersteig\", \"Hochtour\", \"Alpinklettern\" -- \"Wanderung\" ist damit nicht dasselbe wie der Elternknoten). Deckt ein Nutzerbegriff nur einen Teil eines Subtrees ab, die passenden Kindknoten einzeln übergeben statt des Elternknotens. thing_count_without_subtree 0 bei is_leaf false kennzeichnet einen reinen Gruppierungsknoten, dem selbst kein Inhalt zugeordnet ist. Die Antwort trägt zusätzlich ein description-Feld mit der Definition des abgefragten Baums (sofern hinterlegt) -- es nennt Struktur und Fallen, die aus der flachen Werteliste nicht ablesbar sind, etwa Pseudo-Knoten zwischen Wurzel und Werten oder namensgleiche Concepts, die gemeinsam gefiltert werden müssen. Systemvoraussetzung: die Counts werden über die Ergebnismenge DIESES Endpoints gerechnet, also inklusive seiner eigenen Filter. Dieselbe Frage an einem anderen Endpoint liefert daher andere Zahlen, und die instanzweite Zahl aus list_concepts (thing_count) ist regelmässig grösser -- beim Berichten also den Endpoint mitnennen, statt die Zahlen als instanzweit auszugeben."
        arguments:
          min_count_with_subtree: "Mindestanzahl Contents (inkl. Subtree), default 1 -- nur Concepts, unter denen der Endpoint tatsächlich Inhalte hat. 0 nimmt auch leere Concepts auf (bei großen Bäumen viele Tausend Werte)."
          min_count_without_subtree: "Mindestanzahl Contents (ohne Subtree), default 0"
      resolve_concepts:
        description: "Bildet EINEN Nutzerbegriff (z.B. \"vegan\", \"Wandern\") auf ALLE zugehörigen Concepts im Endpoint %{endpoint_name} ab und liefert in \"classification_alias_id_group\" eine fertige, ODER-verknüpfte Gruppe für classification_alias_id_groups von search_contents -- diese Liste unverändert übernehmen. VOR search_contents für jede Kategorie-, Themen- oder Ausstattungsbedingung aufrufen, je Bedingung ein eigener Aufruf (\"vegane Restaurants in Vorarlberg\" sind drei). Das Tool ersetzt das manuelle Sammeln von Varianten über facet_values/list_concepts: derselbe Sachverhalt liegt in importierten Beständen als mehrere Concepts mit verschiedenen UUIDs vor (z.B. \"Vegan\", \"Vegane Kost\", \"Vegane Speisen\" als getrennte Concepts, je nach Importquelle), und nur eine davon zu filtern liefert eine plausible, aber massiv zu niedrige Zahl. \"count\" ist die echte Trefferzahl der Vereinigung (nicht die Summe der Einzelzahlen, die Inhalte mit mehreren Varianten doppelt zählt), \"largest_single_variant_count\" die stärkste Einzelvariante -- die Differenz ist genau der Fehler, den ein einzelner Namenstreffer verursacht hätte. In \"concepts\" trägt jede Variante ihre endpoint-spezifische Anzahl und, wenn sie NICHT in der Gruppe steckt, den Grund (leer in diesem Endpoint, oder redundant weil ein Vorfahr die Gruppe per Subtree schon abdeckt). Die Vereinigung ist ein Vorschlag auf Namensbasis und deshalb VOR dem Berichten einer Zahl gegen \"concepts\" zu prüfen: ein kurzer Begriff sammelt auch Zusammensetzungen ein, die der Nutzer nicht meint (z.B. trifft \"Restaurant\" auch \"Schnellrestaurant/Fast Food\" und \"Bar-Restaurant\" -- die Differenz zwischen count und largest_single_variant_count zeigt, wie viel davon zusammenkommt). Nicht gemeinte Varianten weglassen und die verwendeten Concepts in der Antwort benennen. Findet das Tool nichts, ist \"classification_alias_id_group\" LEER und die Antwort enthält KEINEN count, sondern ein \"warning\": eine leere Gruppe an search_contents übergeben filtert nichts und liefert die Gesamtmenge des Endpoints -- als Antwort gelesen wäre das eine massiv zu hohe Zahl (typischer Fall: ein Ausstattungsbegriff wie \"barrierefrei\" existiert in mehreren Bäumen gleichlautend, aber in DIESEM Endpoint trägt ihn kein Inhalt). Diesen Fall als \"dazu führt der Endpoint keine Klassifikation\" berichten oder über concept_scheme_ids einen per browse_concept_schemes gefundenen, nicht kuratierten Baum prüfen -- NICHT auf den query-Volltext ausweichen."
        arguments:
          term: "Der Nutzerbegriff EINER Bedingung, z.B. \"vegan\" oder \"Wandern\". Nicht mehrere Bedingungen zusammen (\"vegane Restaurants in Vorarlberg\") -- je Bedingung ein eigener Aufruf, das Ergebnis wird je eine Gruppe in classification_alias_id_groups."
          concept_scheme_ids: "Nur in diesen Klassifikationsbäumen suchen (IDs aus list_facets/browse_concept_schemes). Ohne Angabe werden die Facetten dieses Endpoints durchsucht -- dieselben, die list_facets nennt."
          include_empty: "Varianten ohne Inhalte in diesem Endpoint mit in die Gruppe aufnehmen. Default false -- sie filtern nichts weg, blähen die Gruppe aber auf."
          limit: "Max. Anzahl geprüfter Namenstreffer"
      list_templates:
        description: "Listet die im Endpoint %{endpoint_name} tatsächlich vorkommenden Content-Templates (schema.org-Typen) samt Anzahl -- die Discovery zum template_names-Filter von search_contents. VOR jeder Frage nach einem Typ aufrufen (\"Restaurants (FoodEstablishment)\", \"alle Unterkünfte\"): fehlt ein vom Nutzer genannter Typ in dieser Liste, führt der Endpoint ihn nicht, und die Frage ist NICHT über template_names beantwortbar -- dann prüfen, ob der Sachverhalt als Kategorie modelliert ist (list_facets/facet_values). Welche Form hier gilt, zeigt erst der Abgleich dieser Liste mit den Facetten aus list_facets -- ein vom Nutzer genannter Typ, der hier fehlt, liegt oft als allgemeinerer Typ plus Kategorie-Facette vor. Typ und Kategorie sind zwei verschiedene Dimensionen und beide zu prüfen: der Typ trennt Restaurant von Unterkunft, die Kategorie trennt Restaurant von Bar. Systemvoraussetzung: die Liste ist aus den Inhalten des Endpoints gezählt, nicht aus den installierten Templates -- ein Template ohne Inhalt im Endpoint fehlt hier, auch wenn die Instanz es kennt und get_schema es beschreibt. \"Der Typ existiert nicht\" ist daraus also nicht ableitbar, wohl aber \"dieser Endpoint führt keine Inhalte dieses Typs\"."
      list_attributes:
        description: "Listet die für den Endpoint %{endpoint_name} filterbaren Attribute (advanced_search) samt Typ, Label und Einheit -- zur Vorbereitung des attributes-Filters von search_contents. Werte in \"attributes\" IMMER in der hier angegebenen \"unit\" übergeben, nicht in der Einheit der Nutzerfrage: bei unit \"m\" wird aus \"unter 15 km\" max: 15000. Fehlt \"unit\", ist das Attribut einheitenlos. Systemvoraussetzungen: die Liste stammt aus den Template-Definitionen (Properties mit advanced_search, materialisiert aus den installierten Templates) und NICHT aus den Daten -- eine leere Liste heißt \"für die Templates dieses Endpoints ist kein Attribut als filterbar konfiguriert\" und ist eine Konfigurationslücke, kein Grund, ersatzweise über query zu suchen. Ein neu als filterbar konfiguriertes Attribut erscheint erst nach dem nächsten Template-Import, der die materialisierte Sicht erneuert. Antwortet das Tool mit einem Datenbank-/SQL-Fehler statt mit einer Liste, ist der Schema-Stand der Instanz hinter ihren Migrationen -- das ist als Instanzproblem zu berichten und nicht durch einen anderen Aufruf zu umgehen."
      statistics:
        description: "Zeitliche Statistik (Anzahl Contents pro Zeit-Bucket) für den Endpoint %{endpoint_name}. Nur \"dct:created\"/\"dct:modified\" als Attribut möglich. Systemvoraussetzung bzw. Vorbehalt: beide Zeitstempel sind technische Systemzeiten (Anlage und letzte Änderung IM System), keine inhaltlichen Daten. Ein Importlauf setzt dct:modified für Tausende Inhalte gleichzeitig, ein Bestand kann komplett am Migrations-/Importdatum hängen -- Ausschläge in der Kurve zeigen also Systemereignisse und NICHT redaktionelle Aktivität oder gar inhaltliche Zeitbezüge wie Veranstaltungstermine (dafür der schedule-Filter von search_contents). Beim Berichten dazusagen, dass gezählt wird, wann ein Inhalt zuletzt geschrieben wurde."
        arguments:
          attribute: "Zeitstempel-Attribut"
      timeseries:
        description: "Zeitreihen-Daten (z.B. Sensor-/Wetterwerte) für einen einzelnen Content innerhalb des Endpoints %{endpoint_name}. Systemvoraussetzung: das angefragte Attribut muss am Template dieses Contents als Zeitreihe modelliert und für ihn befüllt sein -- Zeitreihen kommen aus angebundenen Messquellen und existieren nur bei wenigen Templates. Ist es keine Zeitreihen-Property, meldet das Tool \"no timeseries data found\"; das ist die Modellierung/Datenlage dieses Inhalts und kein falsches Argument. Welche Properties ein Content führt, zeigt get_content."
        arguments:
          id: "(muss im Endpoint sichtbar sein)"
          attribute: "(siehe get_content für verfügbare Properties)"
      elevation_profile:
        description: "Höhenprofil einer Route/Linie (Content mit Linien-Geometrie und Höhendaten) innerhalb des Endpoints %{endpoint_name}. Systemvoraussetzungen: der Content braucht eine primäre Linien-Geometrie (LINESTRING/MULTILINESTRING) UND Höhenwerte darin (Z-Koordinate). Beides ist Sache der Importquelle: eine Punkt-Geometrie (POI, Unterkunft) hat nie ein Profil, und eine Tour ohne Z-Werte ebenfalls nicht. Fehlt eines von beidem, antwortet das Tool mit \"not found\" und der jeweiligen Begründung (keine Geodaten / keine Höhendaten) -- das unterscheidet \"Inhalt existiert nicht\" von \"Inhalt trägt keine Höhendaten\" und ist so zu berichten, statt es als fehlenden Inhalt zu deuten."
        arguments:
          id: "(braucht Linien-Geometrie mit Höhendaten)"
      download:
        description: "Liefert eine Download-URL für den Endpoint %{endpoint_name} (oder einen einzelnen Content darin) im gewünschten Format. Kein Datei-Byte-Transfer über MCP -- die URL erfordert denselben Bearer-Token wie diese MCP-Session. Systemvoraussetzungen: das Download-Feature muss für dieses Ziel (Endpoint bzw. Content) freigeschaltet und für das gewünschte Format ein Serializer aktiviert sein. Beides ist instanz- und endpointspezifisch, deshalb gibt es hier bewusst keine feste Formatliste -- ein nicht freigegebenes Format wird mit \"invalid_format\" abgelehnt. Diese Ablehnung sagt nichts über die Inhalte aus: sie heißt \"dieser Endpoint gibt dieses Format nicht heraus\", nicht \"es gibt nichts herunterzuladen\"."
        arguments:
          format: "Serialisierungsformat, z.B. \"gpx\", \"json\", \"xml\""
          id: "(optional: für Einzel-Download, sonst der gesamte Endpoint)"
        # Part of the RESPONSE, not of the description: the returned URL is not an open link.
        note: "Erfordert denselben Bearer-Token wie diese MCP-Session (Authorization-Header)."
      select_things:
        description: "Lädt mehrere Contents per ID-Liste instanzweit (kein Endpoint-Scope) -- das Batch-Pendant zu get_content, das nur eine einzelne ID nimmt. Systemvoraussetzung: der API-Sichtbarkeitsbereich des aufrufenden Nutzers (die für ihn konfigurierten API-Filter). Die Antwort kann daher WENIGER Einträge enthalten als IDs übergeben wurden, ohne dass das ein Fehler ist -- fehlende IDs sind entweder unbekannt oder ausserhalb des Scopes; das ist beim Berichten zu unterscheiden."
        arguments:
          limit: "Max. Anzahl Ergebnisse"
      resolve_place:
        description: "Löst einen Ortsnamen (Bundesland, Bezirk, Gemeinde) auf einen Geo-Filter auf und nennt die Trefferzahl je Quelle -- die Discovery zum place-Filter von search_contents. VOR jeder Frage mit Ortsbezug (\"in Vorarlberg\", \"in der Gemeinde Egg\") aufrufen, statt den Ort über classification_alias_ids oder query abzubilden. Der Grund ist eine Abdeckungslücke: eine reine Klassifikations-Facette trifft nur Inhalte MIT Baum-Zuordnung, und Inhalte ohne fehlen still im Ergebnis -- je nach Bestand ein erheblicher Teil, weil ein Teil der Inhalte weder eine Baum-Zuordnung noch brauchbare Koordinaten trägt und nur über die Adresse lokalisierbar ist. Das Tool nimmt deshalb NUR einen Ortsnamen: die Auflösung läuft serverseitig in fester Reihenfolge (Klassifikationsbaum, dann geo_regions per Polygon, dann Adresse) und ist pro Inhalt einzeln wirksam. Diese Reihenfolge ist NICHT wählbar und auch nicht zu umgehen. coverage nennt, wie viele Treffer aus welcher Stufe kommen: ein Ergebnis, das überwiegend aus \"address\" stammt, ist schwächer belegt als eines aus \"classification\" und beim Berichten der Zahl zu erwähnen. resolved false heißt, der Name existiert in den geprüften Bäumen nicht -- dann ist die Frage NICHT über place beantwortbar und der Ortsname darf auch nicht als query eingesetzt werden. Systemvoraussetzungen, je Stufe verschieden und je einzeln abschaltbar: die Kaskade insgesamt braucht das aktivierte mcp-Feature mit eingeschalteter Geo-Kaskade (mcp.geo.enabled); ist es aus oder ist kein Auflösungsbaum konfiguriert (das Gem liefert nur den administrativen Baum mit, jeder weitere ist instanzspezifisch), ist resolved IMMER false -- unabhängig davon, ob der Ort in den Daten existiert. Stufe 2 (geo_regions) greift nur, wenn Bäume konfiguriert sind, deren Concepts Polygone tragen; ohne solche bleibt sie dauerhaft ohne Treffer. Stufe 3 (Adresse) hängt an zwei Konfigurationen: den Verwaltungspräfixen, die vor dem Namensabgleich abgeschnitten werden (\"Gemeinde Egg\" -> \"Egg\"), und den PLZ-Mustern je Ort -- ohne PLZ-Muster fehlen genau die Ortsteile, die im Baum nicht als Concept existieren. stages[].resolved nennt pro Stufe, ob sie für DIESEN Ort etwas beitragen kann; steht dort überall false, ist das eine Konfigurationslücke der Instanz und als solche zu berichten, nicht als \"keine Daten\"."
        arguments:
          place: "Ortsname, wie der Nutzer ihn genannt hat (Bundesland, Bezirk, Gemeinde), z.B. \"Vorarlberg\". Exakter Name, kein Teilstring -- \"Bregenzerwald\" statt \"Bregenzerwald Tourismus\"."
      recent_queries:
        description: "Listet die letzten MCP-Abfragen des aufrufenden Nutzers, neueste zuerst: je Eintrag das aufgerufene Tool, die ARGUMENTE des Aufrufs, die berichtete Trefferzahl und den Endpoint, gegen den gemessen wurde (leer = instanzweit). Dafür gedacht, an eine frühere Abfrage anzuknüpfen, statt sie zu erraten: bei \"und wie viele davon ...\", \"dasselbe für ...\", \"wie war die Zahl von vorhin\" zuerst diesen Verlauf holen und die dort protokollierten Argumente als Ausgangspunkt nehmen -- eine neu zusammengestellte Filterstellung liefert eine andere Zahl, und der Unterschied ist für den Nutzer nicht erkennbar. Die Argumente sind unverändert protokolliert und damit direkt wieder an dasselbe Tool übergebbar. Auch fehlgeschlagene Aufrufe stehen im Verlauf (\"error\"), damit derselbe Fehler nicht wiederholt wird. Mit \"tool\" auf ein Tool einschränken, z.B. \"search_contents\"."
        arguments:
          limit: "Max. Anzahl Einträge, neueste zuerst"
          tool: "Nur Aufrufe dieses Tools, z.B. \"search_contents\""
      universal_lookup:
        description: "Bestimmt den Typ einer beliebigen UUID (Content, Concept Scheme, Concept, Schedule) und liefert einen kurzen Deskriptor -- Ausgangspunkt, um eine unbekannte ID weiter aufzulösen. Systemvoraussetzung: gesucht wird nur dort, wo der aufrufende Nutzer sehen darf -- Contents im API-Sichtbarkeitsbereich (siehe select_things), Bäume und Concepts nur, soweit sie für die API freigegeben sind. Eine nicht aufgelöste UUID kann daher trotzdem existieren; \"unbekannt\" heisst hier \"in keiner der zugänglichen Quellen gefunden\"."
        arguments:
          id: "(Content, Concept Scheme, Concept oder Schedule)"
      browse_concept_schemes:
        description: "Listet alle instanzweit verfügbaren Concept Schemes (Klassifikationsbäume), optional gefiltert nach Namen. Einträge dokumentierter Bäume tragen ein description-Feld mit Dimension, Struktur, Belegung und Abgrenzung zu ähnlich benannten Bäumen -- das vor der Auswahl lesen, weil der Name allein die Dimension oft nicht verrät. Der search-Parameter matcht NUR auf den Namen, nicht auf diese Definitionen: einen Baum nach seiner Dimension zu suchen (\"Ernährung\", \"Ausstattung\") schlägt deshalb regelmässig fehl, obwohl er existiert -- in dem Fall ohne search aufrufen und die volle Liste samt Definitionen durchgehen. Systemvoraussetzung: gelistet wird nur, was für die API freigegeben und nicht als intern markiert ist. Ein nicht freigegebener Baum fehlt hier vollständig -- samt seiner Concepts, die dann auch list_concepts nicht auflösen kann -- obwohl Inhalte an ihm hängen. \"Existiert nicht\" ist aus dieser Liste also nicht ableitbar; ohne Treffer bleibt nur, die Dimension als in dieser Instanz nicht über MCP zugänglich zu melden."
      list_concepts:
        description: "Listet Concepts innerhalb eines Concept Scheme (aus browse_concept_schemes). Mit \"search\" lassen sich Nutzerbegriffe (z.B. \"Wandern\") auf Concept-IDs mappen; ohne \"search\" werden nur die obersten Concepts geliefert. WICHTIG bei mehreren Treffern: derselbe Sachverhalt liegt häufig als mehrere Concepts mit verschiedenen UUIDs vor, weil jede Importquelle ihre eigene Variante mitbringt -- gleichlautende Namen ebenso wie Synonyme (z.B. \"Vegan\", \"Vegane Kost\", \"Vegane Speisen\" als getrennte UUIDs, von denen typischerweise nicht alle befüllt sind). NIEMALS nur den ersten Treffer nehmen: das liefert eine plausible, aber massiv zu niedrige Trefferzahl. Alle inhaltlich gleichbedeutenden Varianten sammeln und in EINER classification_alias_id_groups-Gruppe ODER-verknüpft an search_contents übergeben. Jeder Treffer trägt dazu thing_count (Anzahl Inhalte instanzweit, ohne embedded): daran ist ablesbar, welche Varianten befüllt sind und wie viel das Weglassen einer kostet. Eine Variante mit thing_count 0 kann weggelassen werden, jede andere NICHT. Die endpoint-spezifische Anzahl liefert facet_values. Innerhalb eines Endpoints diese Sammelarbeit NICHT selbst machen: resolve_concepts (Endpoint-Server) bildet die Vereinigung, liefert die fertige Gruppe und die echte Vereinigungs-Trefferzahl -- dieses Tool bleibt der instanzweite Fallback für Concepts außerhalb jedes Endpoints. Systemvoraussetzungen: der Baum muss für die API freigegeben und nicht als intern markiert sein (sonst ist die concept_scheme_id nicht auflösbar, siehe browse_concept_schemes). thing_count zählt instanzweit und ohne embedded Inhalte, also OHNE Endpoint-Scope und ohne den API-Sichtbarkeitsbereich des Nutzers -- die Zahl dient dem Grössenvergleich der Varianten und ist keine Trefferzahl, die berichtet oder mit search_contents verglichen werden darf."
        arguments:
          limit: "Max. Anzahl Ergebnisse"
          concept_scheme_id: "(aus browse_concept_schemes)"
          search: "(um Nutzerbegriffe auf Concepts zu mappen, z.B. \"Wandern\"; ohne Angabe werden nur die obersten Concepts geliefert)"
      list_endpoints:
        description: "Listet die für den aufrufenden Nutzer verfügbaren API-Endpoints (StoredFilter mit api: true) -- Ausgangspunkt, um einen passenden Single-Endpoint-MCP-Server zu finden. Je Endpoint kommen, sofern gepflegt, \"description\" (die redaktionelle Beschreibung, ohne Markup), \"language\" und \"concept_schemes\" zurück: DIESE Angaben sind die Auswahlgrundlage, nicht der Name -- ein Name wie \"Touren\" sagt weder, was sonst noch enthalten ist, noch auf welchen Dimensionen sich filtern lässt. Ein fehlendes Feld heisst \"nicht gepflegt\" und nicht \"leer\"; fehlende concept_schemes heissen insbesondere NICHT, dass der Endpoint keine Facetten hat -- ohne Kuratierung leitet list_facets sie dort aus den tatsächlich vorkommenden Bäumen ab. Wie viele Inhalte ein Endpoint führt und welche Templates darin vorkommen, steht hier bewusst NICHT (das beantwortet nur das Ausführen des jeweiligen Filters): dafür am Endpoint selbst list_templates bzw. search_contents ohne Filter aufrufen. Systemvoraussetzungen: ein gespeicherter Filter erscheint hier nur, wenn er als API-Endpoint freigegeben (api: true) und benannt ist und der aufrufende Nutzer ihn sehen darf. Ein erwarteter, aber fehlender Endpoint ist damit eine Freigabe-, Benennungs- oder Rechtefrage und kein Hinweis auf fehlende Inhalte. Jeder Endpoint braucht ausserdem eine eigene MCP-Server-Konfiguration im Client (eigene URL, derselbe Bearer-Token) -- hier gelistet zu sein heisst nicht, aus dieser Session heraus abfragbar zu sein."
      describe_endpoint:
        description: "Beschreibt EINEN Endpoint vollständig und sagt, WELCHE TOOLS DORT ETWAS BEANTWORTEN -- der Einstieg vor der ersten inhaltlichen Abfrage und die Antwort auf \"was kann ich hier fragen\". Ohne Argument gilt der Ergebnisraum dieses Servers (am Endpoint-Mount also der Endpoint, an dem der Client hängt -- er muss ihn nicht kennen), mit \"endpoint_id\" ein beliebiger für den Nutzer freigegebener Endpoint (IDs aus list_endpoints). Zurück kommen: \"content_count\" und \"templates\" (Typen samt Anzahl, wie list_templates); \"details\" -- die geführten Detail-Dimensionen, je Eintrag \"templates\"/\"api_names\" (welche Typen die Dimension DEKLARIEREN, also was ein Inhalt tragen KANN) neben \"content_count\"/\"share\" (wie viele Inhalte sie tatsächlich TRAGEN); und \"tools\" -- je Tool dieses Servers ein Urteil. Die beiden Angaben je Dimension sind NICHT dasselbe und der Grund für dieses Tool: ein Typ kann eine Linie mit Höhendaten deklarieren, ohne dass ein einziger Inhalt des Endpoints eine trägt -- elevation_profile antwortet dann bei jedem Inhalt mit \"nicht gefunden\", was als eigener Fehler gelesen und wiederholt wird statt als leere Dimension. Eine Dimension, die in \"details\" FEHLT, wird von keinem Typ dieses Endpoints deklariert (es gibt sie hier also gar nicht, sie ist nicht bloß ungepflegt). Die drei Urteile in \"tools\": \"recommended\" = lohnt sich hier, weil ein nennenswerter ANTEIL der Inhalte die Dimension trägt (oder weil es ein Kern-Tool ist); \"available\" = läuft, ist aber nicht der Einstieg -- entweder hängt das Tool an keiner gemessenen Dimension (dann fehlt \"detail\"), oder seine Dimension ist belegt, aber zu dünn für eine Empfehlung (dann nennt \"detail\" sie, und deren \"share\" in \"details\" sagt, wie dünn: bei 0.009 trägt einer von hundert Treffern etwas bei). Ein \"available\" mit \"detail\" ist also KEIN Grund, das Tool zu meiden -- für die wenigen Inhalte, die die Dimension tragen, antwortet es; nur als Einstieg für den ganzen Endpoint taugt es nicht. \"no_data\" = die unter \"detail\" genannte Dimension ist hier nicht deklariert oder LEER (kein einziger Inhalt trägt sie), das Tool antwortet also bei JEDEM Inhalt leer -- das ist kein Fehler, nicht wiederholen und dem Nutzer als \"führt dieser Endpoint nicht\" berichten. WICHTIG bei fremder endpoint_id: \"queryable_here\" false heisst, dass alle anderen Tools weiter über den Ergebnisraum DIESES Servers laufen, nicht über den beschriebenen -- der beschriebene Endpoint braucht dafür seine eigene MCP-Server-Konfiguration im Client (siehe list_endpoints). Zahlen sind zum Aufrufzeitpunkt gemessen und nicht redaktionell gepflegt. Abgrenzung: welche Klassifikationsbäume und welche Attribute es konkret gibt, sagen list_facets bzw. list_attributes -- hier steht nur, ob sich deren Aufruf lohnt."
        arguments:
          endpoint_id: "Endpoint, der beschrieben werden soll (ID aus list_endpoints). Ohne Angabe: der Ergebnisraum dieses Servers."
      get_schema:
        description: "Liefert das OpenAPI-Schema eines Content-Templates (schema.org-Typ), oder ohne Angabe die Liste der verfügbaren Templates. Systemvoraussetzung/Abgrenzung: das Schema wird aus den in dieser Instanz installierten Template-Definitionen erzeugt und beschreibt, was ein Typ tragen KANN -- nicht, was in einem Endpoint tatsächlich vorkommt oder befüllt ist. Eine hier dokumentierte Property ist weder zwingend gefüllt noch filterbar: was der Endpoint führt, sagt list_templates, was filterbar ist, list_attributes."
        arguments:
          template: "ThingTemplate-Name oder schema.org-Typ (aus der Route). Ohne Angabe: Liste der verfügbaren Templates."
      list_writable_attributes:
        description: "Listet die SCHREIBBAREN Attribute eines Templates -- die Discovery für create_content/update_content, und die einzige verlässliche Quelle dieser Namen. NICHT durch get_schema oder list_attributes ersetzen: die beschreiben die lesende v4-API und liefern deren API-Namen, die beim Schreiben still verworfen werden (ein API-Name wie \"odta:length\" landet in ignored_attributes, geschrieben wird über den internen Key \"length\"). Je Attribut kommen zurück: \"attribute\" (der Key für data), \"api_name\" (derselbe Wert in der lesenden API, zum Abgleich mit get_schema/search_contents), \"type\", \"label\", \"unit\" (Werte IMMER in dieser Einheit übergeben -- length in m, nicht km), \"concept_scheme\" (bei type classification der Baum, gegen den resolve_concepts/list_concepts aufzulösen ist), \"embedded_template\" (bei embedded/linked das Ziel-Template), \"translatable\" (wird pro Sprache geführt), \"required\" (Pflichtfeld -- fehlt es, wird NICHTS angelegt) und \"recommended\". \"creatable\" false heißt, dass das Template gar nicht anlegbar ist (embedded oder nicht als anlegbar konfiguriert) -- dann ist create_content für diesen Typ kein Weg."
      create_content:
        description: "Legt einen NEUEN Inhalt an (z.B. eine Tour als Template \"Trail\"). SCHREIBENDES Tool: der Datensatz wird sofort persistiert, es gibt keinen Vorschau- oder Bestätigungsschritt und kein Undo -- vor dem Aufruf muss der Nutzer das Anlegen ausdrücklich verlangt haben, nicht bloß über Inhalte gesprochen haben. VORGEHEN, in dieser Reihenfolge: 1. Template bestimmen (list_templates am Endpoint-Server, get_schema ohne Argument instanzweit) -- der Nutzerbegriff ist NICHT der Template-Name -- er kann anders heissen (eine \"Tour\" etwa als \"Trail\") oder gar kein eigener Typ sein, sondern ein allgemeinerer Typ plus Kategorie-Facette. Welcher Fall hier gilt, entscheidet die Discovery, nicht die Vermutung. 2. list_writable_attributes für genau dieses Template aufrufen und die Attributnamen daraus übernehmen; Attributnamen NIEMALS erraten, aus einem anderen Template übertragen oder aus get_schema/list_attributes nehmen -- die beschreiben die LESENDE API und liefern deren API-Namen (\"odta:length\", \"odta:uphillElevation\"), geschrieben wird über die internen Keys (\"length\", \"ascent\"). Ein API-Name als Key legt den Datensatz an, verwirft aber den Wert. 3. Kategorien, Schwierigkeit, Region und jede andere Klassifikation als Array von Concept-UUIDs übergeben, die zuvor per resolve_concepts (Endpoint-Server) oder list_concepts (instanzweit) aufgelöst wurden -- Klartext-Namen werden NICHT aufgelöst und landen als ignoriertes Attribut. Das sind dieselben IDs, die geschrieben werden (facet_values liefert sie ebenfalls), es ist also KEINE eigene ID-Auflösung nötig. \"data\" ist ein FLACHER Attribut-Hash in der Sprache \"locale\"; die Trennung in übersetzbare und sprachneutrale Attribute passiert serverseitig. Die Antwort ist VOR dem Berichten eines Erfolgs zu prüfen und dem Nutzer gegenüber zu benennen: \"ignored_attributes\" listet alle übergebenen Attribute, die das Template nicht kennt oder die nicht von außen schreibbar sind -- die wurden NICHT gespeichert (ohne diese Liste wäre das stille Verwerfen als \"gespeichert\" berichtet worden); \"applied_attributes\" listet die übergebenen Attribute, die geschrieben werden durften, \"changed_attributes\" die davon tatsächlich geänderten (fehlt ein Attribut dort, trug der Inhalt diesen Wert bereits -- das ist kein Fehler und nicht zu wiederholen); \"attribute_name_corrections\" nennt, falls erkennbar, den richtigen internen Key zu einem ignorierten API-Namen; \"warnings\" nennt fehlende empfohlene Angaben; \"data_pool\" nennt den Inhaltspool: ein neu angelegter Inhalt landet per Template-Default üblicherweise im Pool \"Entwurf\" und ist damit in KEINEM öffentlichen API-Endpoint sichtbar -- eine anschließende Suche nach dem Titel liefert deshalb 0 Treffer, das ist kein Fehler. Schlägt eine Validierung fehl (z.B. fehlender Titel), wird NICHTS angelegt und das Tool antwortet mit einem Fehler samt Feldliste. Weitere Sprachen nicht hier, sondern per update_content mit anderem locale nachtragen."
        arguments:
          data: "Flacher Attribut-Hash, Keys sind die Attributnamen aus list_writable_attributes (NICHT die API-Namen aus get_schema/list_attributes -- die werden verworfen). Klassifikationen als Array von Concept-UUIDs (aus resolve_concepts/list_concepts)."
          locale: "Sprache der übersetzbaren Attribute, z.B. \"de\". Default: Default-Sprache der Instanz."
      update_content:
        description: "Ändert Attribute eines BESTEHENDEN Inhalts. SCHREIBENDES Tool: die Änderung wird sofort persistiert und es gibt kein Undo -- vor dem Aufruf muss der Nutzer die Änderung ausdrücklich verlangt haben. Partielles Update: NUR die in \"data\" übergebenen Attribute werden geschrieben, alle anderen bleiben unverändert; ein Attribut leeren heißt, es explizit mit leerem Wert zu übergeben. Attributnamen kommen aus list_writable_attributes für das Template des Inhalts (get_content nennt das Template) -- NICHT aus get_schema oder list_attributes: die liefern die API-Namen der lesenden API (\"odta:length\"), geschrieben wird über die internen Keys (\"length\"), und ein API-Name als Key wird verworfen. Klassifikationen als Concept-UUIDs aus resolve_concepts/list_concepts übergeben. Das sind dieselben IDs, die geschrieben werden (facet_values liefert sie ebenfalls), es ist also KEINE eigene ID-Auflösung nötig. Mit \"locale\" wird die Sprache der übersetzbaren Attribute gewählt; eine noch nicht vorhandene Sprache wird als weitere Übersetzung angelegt, bestehende Übersetzungen bleiben davon unberührt. Die Antwort ist VOR dem Berichten eines Erfolgs zu prüfen: \"applied_attributes\" nennt die übergebenen Attribute, die geschrieben werden durften, \"changed_attributes\" die davon tatsächlich geänderten (fehlt ein Attribut dort, trug der Inhalt diesen Wert bereits -- das ist kein Fehler und nicht zu wiederholen), \"ignored_attributes\" die still verworfenen Attribute (Template kennt sie nicht oder sie sind nicht von außen schreibbar) und \"warnings\" die Hinweise zum Schreibvorgang (u.a. \"keine Änderungen\"). Enthält die Antwort \"external_source\", ist der Inhalt IMPORTIERT: die Änderung wird beim nächsten Importlauf dieser Quelle überschrieben, sofern das Attribut nicht als Overlay geführt wird -- das ist dem Nutzer zu sagen, statt die Änderung als dauerhaft zu berichten. Eingebettete Inhalte (embedded) können nicht direkt geschrieben werden, sondern nur über ihren übergeordneten Inhalt."
    # Definitions of the classification trees, delivered by list_facets, browse_concept_schemes and
    # facet_values. The key is the exact tree name (ConceptScheme#name).
    #
    # Purpose: the name alone does not tell an LLM which dimension a tree covers, how deep it is, or
    # what it does NOT contain. Guessing that is not detectably wrong -- the client filters on a
    # plausible tree, gets a plausible number and reports it without reservation. Each definition
    # therefore states: dimension, structure, coverage and the concrete pitfall.
    #
    # NO measured figures in these texts. The response carries the numbers itself: concept_count,
    # depth and thing_count per tree (Mcp::ConceptSchemeMetrics), plus the per-value thing_counts
    # from facet_values. Written along as prose they went stale with every import without a client
    # being able to see their age -- it read them as a current finding and passed them on. What is
    # left here is what cannot be measured: which dimension a tree covers, what it does NOT contain,
    # which values belong together for one user question. Where a ratio carries the point ("thinly
    # populated"), the text names the response fields that evidence it.
    #
    # A tree without an entry here simply carries no description field.
        arguments:
          id: "Content-UUID (z.B. aus create_content oder search_contents)."
          data: "Flacher Attribut-Hash mit NUR den zu ändernden Attributen, Keys aus list_writable_attributes (NICHT die API-Namen aus get_schema/list_attributes -- die werden verworfen). Klassifikationen als Array von Concept-UUIDs."
          locale: "Sprache der übersetzbaren Attribute, z.B. \"de\". Eine noch nicht vorhandene Sprache wird als weitere Übersetzung angelegt. Default: Default-Sprache der Instanz."
    sort:
      parameter: "Sortierung des Ergebnisses -- OHNE diesen Parameter ist die Reihenfolge die redaktionelle Standardsortierung (boost/updated_at) und limit liefert eine BELIEBIGE Teilmenge. Jede \"höchste/längste/größte/nächstgelegene/neueste N\"-Frage MUSS ihn setzen -- limit allein ergibt KEINE Rangliste, sondern eine plausible Falschantwort. Nur EIN Kriterium (mehrfach ist im Query-Layer nicht möglich). Der sortierte Wert steht je Treffer als sort_value (samt unit) im Ergebnis und ist vor dem Berichten der Rangliste zu prüfen."
      attribute: "Sortierschlüssel: ein numerisches Attribut aus list_attributes (z.B. \"odta:length\"), oder \"dct:created\"/\"dct:modified\" (Änderungsdatum), \"name\" (Titel alphabetisch), \"distance\" (Entfernung -- nur zusammen mit near). Nicht numerische Attribute (Datum, Text, Boolean) sind NICHT sortierbar und liefern einen Fehler mit der Liste der zulässigen Schlüssel -- nicht auf query oder eine Sortierung im Client ausweichen."
      direction: "asc = aufsteigend (kleinster/nächster/frühester Wert zuerst), desc = absteigend. Default: desc für Zahlen und Datumsangaben (\"die längsten\", \"die neuesten\"), asc für name und distance."
    template_lookup:
      argument: "ThingTemplate-Name, z.B. \"Trail\" für eine Tour. Discovery: get_schema (ohne Argument) bzw. list_templates."
    # Texts a tool returns as its RESULT when the question was answerable but the answer is empty --
    # an unknown template, an unknown id, an unresolvable place name. Deliberately NOT a tool error
    # (Mcp::ErrorMapper): the call succeeded, only the thing looked for does not exist, and an error
    # would be a reason for a client to retry.
    errors:
      unknown_template: "Unbekanntes Template \"%{template}\". Die verfügbaren Namen liefert get_schema ohne Argument bzw. list_templates."
      unknown_id: "Zu der ID %{id} gibt es weder einen Inhalt noch einen Klassifikationsbaum, ein Concept oder einen Termin -- die ID ist unbekannt oder liegt außerhalb des Sichtbarkeitsbereichs."
      unresolved_place: "Der Ortsname \"%{place}\" kommt in keinem der konfigurierten Auflösungsbäume vor (siehe searched_concept_schemes). Der place-Filter bleibt damit wirkungslos: eine Trefferzahl wäre die ungefilterte Gesamtmenge und darf NICHT als \"so viele gibt es dort\" berichtet werden."
    # Notices that travel in the response envelope's `warnings` rather than in the payload
    # (Tools::Base#warnings): they say the answer beside them rests on something that did not take
    # effect, which a client must see without knowing where in the payload to look.
    warnings:
      downsampled_series: "Diese Reihe wurde auf %{returned} von %{total} Punkten ausgedünnt. Ihr VERLAUF stimmt, die einzelnen Punkte nicht: Minimum, Maximum, Summe oder ein einzelner Wert dürfen daraus nicht berichtet werden, und die Punkte dürfen nicht als Messungen gezählt werden. Für exakte Werte den Zeitraum einschränken oder aggregieren (Argumente time und group_by, sofern das Tool sie anbietet)."
      unresolved_concept_ids: "Diese übergebenen Concept-IDs entsprechen keinem Concept und filtern daher NICHTS: %{ids}. Der count daneben ist die ungefilterte Menge und darf nicht als der gesuchte Ausschnitt berichtet werden. Meist eine ID, die kein Concept bezeichnet (etwa eine Inhalts- oder Schema-ID) -- resolve_concepts liefert je Begriff die richtige Gruppe, und applied_filters nennt die Gruppe, in der die ID übergeben wurde."
      unresolved_place: "Der Ortsname \"%{place}\" konnte nicht aufgelöst werden und filtert daher NICHTS. Der count daneben ist die ungefilterte Menge und darf nicht als \"so viele gibt es dort\" berichtet werden. resolve_place nennt die durchsuchten Concept Schemes, applied_filters.place enthält denselben Befund."
    # Texts of the resolve_concepts response (Mcp::ConceptResolver) -- part of the result and
    # therefore here rather than in the tool description.
    concept_resolver:
      empty_group_warning: "classification_alias_id_group ist LEER -- dieser Begriff ist in den geprüften Bäumen nicht filterbar. Die Gruppe NICHT an search_contents übergeben: eine leere Gruppe filtert nichts und die Antwort wäre die Gesamtmenge des Endpoints, nicht der gesuchte Ausschnitt. Deshalb enthält diese Antwort auch keinen count. Entweder als \"dazu führt der Endpoint keine Klassifikation\" berichten, oder über concept_scheme_ids einen per browse_concept_schemes gefundenen, nicht kuratierten Baum prüfen -- NICHT auf den query-Volltext ausweichen."
      # Why a variant that was found is NOT part of the group.
      excluded:
        redundant: "redundant: ein Vorfahr steht bereits in der Gruppe und zieht diesen Knoten über den Subtree mit"
        empty: "in diesem Endpoint leer"
    concept_schemes:
      "Administrative Einheiten":
        description: "Politisch-administrative Gliederung in vier Ebenen: Staat > Bundesland/Kanton > Bezirk > Gemeinde. Der Baum, in dem resolve_place einen Ortsnamen zuerst sucht. Er ist vollständig geseedet und NICHT aus den Inhalten abgeleitet: die grosse Mehrheit seiner Concepts trägt null Inhalte, ein Namenstreffer belegt also NICHT, dass zu diesem Ort Daten existieren -- das klärt erst facet_values (Default min_count_with_subtree 1) oder resolve_place; der Abstand zwischen concept_count und thing_count zeigt das Verhältnis. Touristische Regionsnamen (\"Montafon\", \"Bregenzerwald\") existieren hier NICHT, die stehen in \"Regionen Vorarlberg\". Für Ortsfilter ist resolve_place diesem Baum vorzuziehen: eine reine Klassifikationsfacette verfehlt alle Inhalte ohne Baumzuordnung, die nur über ihre Adresse lokalisierbar sind."
      "Regionen Vorarlberg":
        description: "Touristische statt administrativer Gliederung Vorarlbergs, drei Ebenen und nur wenige Concepts: unter der Wurzel \"Tourismusdestination\" die sechs Destinationen (Alpenregion Vorarlberg, Bodensee-Vorarlberg, Bregenzerwald, Kleinwalsertal, Lech Zürs, Montafon), unter der Wurzel \"Sonstige\" vier kleinere Verbände (amKumma, Bödele, Im Walgau, Witus), darunter einzelne Orte und Skigebiete (Bludenz, Brand, Lünersee, Skigebiet Golm, ...). Der am dichtesten belegte Regionsbaum der Instanz. Kein Konkurrenzbaum zu \"Administrative Einheiten\", sondern eine andere Dimension: Nutzer nennen meist die Destination, die dort gar nicht existiert. Eine Destination ist ein Elternknoten -- ohne include_subtree trifft der Filter nur Inhalte, die direkt an ihr hängen, nicht die ihrer Orte."
      "Kategoriebaum Vorarlberg - POI 2022":
        description: "Sachkategorie von POIs (überwiegend TouristAttraction/Place) unter 16 Wurzelästen: Banken, Bauwerke und Gebäude, Behörden, Dienstleistungen, Einkaufen und Handel, Freizeit, Fremden- und Freizeitführer, Gesundheit, Kunst und Kultur, Mobilität und Verkehr, Natur-Sehenswürdigkeiten, Notdienste, Öffentliche Einrichtungen, Sport, Touristische Einrichtungen, Verleihe. WICHTIG, was fehlt: der Baum hat KEINEN Gastronomie-Ast -- Restaurants, Cafés und Bars liegen ausschliesslich in \"Kategoriebaum Vorarlberg - POI Gastronomie\". Wer Gastronomie hier sucht, findet nichts und schliesst daraus fälschlich, die Instanz führe keine."
      "Kategoriebaum Vorarlberg - POI Gastronomie":
        description: "Betriebsart gastronomischer POIs, flache Liste: Restaurant, Gasthaus / Wirtshaus, Café, Bar & Pub, Bergrestaurant, Jausenstation, Konditorei, Pizzeria, Vinothek, Skihütte & Aprés Ski, Haubenlokal, Alpwirtschaft, Käserei / Sennerei, Hofladen, Brauerei, Bier-/Gastgarten, Buffet / Imbiss / Fastfood, Eisdiele / Eissalon, Heuriger / Buschenschank, Nachtclub / Diskothek / Tanzlokal, Rasthaus / Autobahnraststätte, Sonstiger Gastronomiebetrieb. Die einzige Gastronomie-Dimension der Instanz -- \"Kategoriebaum Vorarlberg - POI 2022\" hat dafür keinen Ast. Entscheidend: Gastronomie ist hier überwiegend NICHT als Template FoodEstablishment modelliert, sondern als TouristAttraction plus einem Wert aus diesem Baum. Eine Frage nach Restaurants ist deshalb über diesen Baum zu beantworten und nicht über template_names."
      "Feratel - Infrastrukturklassifizierungen":
        description: "Sammelbaum aus dem Feratel-Import, der acht Dimensionen in einem Baum mischt: Essen & Trinken, Infrastruktur, Kunst & Kultur, Mobilität & Verkehr, Routen & Touren, Sehenswürdigkeiten, Sport & Freizeit, Wellness & Gesundheit. Trotz des nichtssagenden Namens der Träger der Dimension Küche/Ernährung (\"vegan\", \"vegetarisch\", \"regionale Küche\") -- deshalb ist er trotz seiner Unschärfe kuratiert. Er trägt sie aber NUR für die Gastronomie: er klassifiziert ausschliesslich TouristAttraction. Dieselben Merkmale von Unterkünften stehen in \"Feratel - Merkmale - Unterkünfte\" und \"Feratel - Merkmale - Nachhaltigkeitskriterien\" (beide nicht kuratiert, über browse_concept_schemes erreichbar), und die drei Bäume überschneiden sich auf Betriebsebene nicht. Eine Frage nach vegetarischen/veganen BETRIEBEN ist deshalb über resolve_concepts zu stellen, das alle Bäume absucht -- allein auf diesen Baum gefiltert fehlen die Unterkünfte still, und zwar der grössere Teil des Bestands. Zwei Fallen in der Struktur: (1) unter den Wurzeln hängen Pseudo-Knoten der Form \"<Wurzel> |> Rubrik1\"/\"Rubrik2\", die eigentlichen Werte erst darunter -- ein Filter auf eine Wurzel braucht include_subtree, sonst trifft er praktisch nichts. (2) Die Werte sind ungereinigt und enthalten reihenweise Near-Duplicates nebeneinander (Bar, Bar / Cafe, Bar/Pub/Lounge, Bar-Restaurant; Café, Cafe & Konditorei, Café-Restaurant), die für eine Nutzerfrage gemeinsam in EINE classification_alias_id_groups-Gruppe gehören."
      "Feratel - Unterkunftsarten":
        description: "Betriebsform von Unterkünften (LodgingBusiness), flache Liste: Hotel, Hotel Garni, Aparthotel, Berghotel / Berggasthof, Gasthof, Pension, Frühstückspension, Privatzimmer, Bed & Breakfast, Ferienwohnung / Appartement (der mit Abstand grösste Wert), Ferienhaus, Chalet, Bauernhof, Campingplatz, bewirtschaftete Hütte, Hütte / Schutzhütte, Jugendherberge, Hostel, Gruppenunterkunft, Selbstversorgerhaus, Reiterhof, Schlafen im Stroh und weitere. Drei Eigenheiten: (1) mehrere Werte sind namensgleich mehrfach vorhanden -- \"Chalet\" existiert als drei Concepts, wovon nur eines Inhalte trägt und die anderen leer sind; vor dem Filtern die thing_counts aus facet_values prüfen und alle befüllten Varianten in EINE Gruppe legen. (2) Überlappende Paare wie Privatzimmer / \"Privatzimmer / Bed & Breakfast\" bzw. Frühstückspension / \"Frühstückspension / Privatzimmer\" meinen für eine Nutzerfrage dasselbe. (3) Der Baum ist nicht dimensionsrein: \"Sommer Bergbahnticket Inklusive\" ist ein Angebotsmerkmal, keine Betriebsform. Komfort/Kategorie steht in \"Feratel - Sterne\", Ausstattung in \"Feratel - Merkmale - Unterkünfte\" (nicht kuratiert, über browse_concept_schemes erreichbar)."
      "Feratel - Sterne":
        description: "Sterne-Kategorie von Unterkünften, flache Liste: 1 bis 5 Sterne, jeweils zusätzlich als \"... Superior\". Dünn belegt -- nur ein kleiner Teil der Unterkünfte trägt überhaupt eine Kategorie; der thing_count dieses Baums gegen den von \"Feratel - Unterkunftsarten\" gestellt zeigt die Lücke. Ein Filter auf Sterne schliesst damit die grosse Mehrheit der Unterkünfte aus, weil sie unkategorisiert sind und nicht, weil sie die Kategorie verfehlen; das ist beim Berichten einer Zahl zu erwähnen. \"4 Sterne\" und \"4 Sterne Superior\" sind getrennte Concepts: eine Frage nach \"4 Sterne\" meint in aller Regel beide, eine Frage nach \"mindestens 4 Sterne\" alle vier Concepts ab 4 Sternen."
      "Feratel - Merkmale - Unterkünfte":
        description: "Ausstattungs- und Angebotsmerkmale von Unterkünften (LodgingBusiness) aus dem Feratel-Import; nicht kuratiert, über browse_concept_schemes erreichbar. Trotz des Namens nicht nur Ausstattung: der Baum trägt auch die Dimension Küche/Ernährung für Unterkünfte -- \"Vegetarische Küche\", \"Vegane Küche\", \"Regionale Küche\" stehen HIER und nicht in einem Gastronomie-Baum. Diese Dimension ist nach Betriebsart über drei Bäume verteilt: Gastronomie in \"Feratel - Infrastrukturklassifizierungen\", Unterkünfte hier und in \"Feratel - Merkmale - Nachhaltigkeitskriterien\"; die Bestände überschneiden sich zwischen Gastronomie und Unterkunft nicht. Eine Frage nach vegetarischen/veganen BETRIEBEN ist deshalb über resolve_concepts zu stellen, das alle Bäume absucht -- auf einen dieser Bäume allein gefiltert fehlt die jeweils andere Betriebsart still. Zweite Falle: der Baum klassifiziert nicht nur LodgingBusiness, sondern in weit grösserem Umfang Offer (Pauschalangebote) und ausserdem Event -- ohne template_names zählt jede Facette aus ihm Angebote mit, und die Zahl ist keine Betriebszahl."
      "Feratel - Merkmale - Nachhaltigkeitskriterien":
        description: "Nachhaltigkeitsmerkmale von Unterkünften (LodgingBusiness) und Veranstaltungen (Event) aus dem Feratel-Import; nicht kuratiert, über browse_concept_schemes erreichbar. Dünn belegt, aber für die Dimension Küche/Ernährung nicht verzichtbar: \"Auswahl an vegetarischen und veganen Speisen und Getränken\" steht hier und in keinem anderen Baum. Ein erheblicher Teil der so ausgezeichneten Unterkünfte trägt AUSSCHLIESSLICH dieses Merkmal und fehlt damit in jeder Zahl, die allein aus \"Feratel - Merkmale - Unterkünfte\" oder \"Feratel - Infrastrukturklassifizierungen\" kommt -- resolve_concepts sammelt die drei Bäume gemeinsam ein. Die Merkmale sind redaktionell gepflegt und nicht flächendeckend: eine niedrige Trefferzahl heisst hier \"nicht ausgezeichnet\" und nicht \"nicht vorhanden\"."
      "Feratel - Urlaubsthemen":
        description: "Themen- und Marketing-Tags aus dem Feratel-Import, flache Liste und der breitest belegte Themenbaum der Instanz. Bewusst heterogen und NICHT als saubere Kategorisierung zu lesen: echte Urlaubsthemen (Aktiv, Adventure, Angeln & Fischen, Am Berg) stehen neben Pauschalangeboten (All Inclusive, Arlberg Weinberg 3 Tage, Almliesl Deluxe), Ortsbezügen (Almtal, Ausflugsziele Brandnertal, Alpines Wipptal) und reinen Buchungsmerkmalen (2Raum, 3Raum, auf Anfrage, Always On). Als Themenfacette brauchbar, als Taxonomie nicht: vor dem Filtern die tatsächlichen Werte über facet_values ansehen, statt vom Namen eines Concepts auf seine Bedeutung zu schliessen."
      "Bergfex - Schnee - Meldung":
        description: "Pistenzustand aus der Bergfex-Schneemeldung, flache Liste: Einzelzustände (Pulver, Sulz, hart, Nassschnee, Altschnee, Kunstschnee, griffig, eisig-hart, weich-nass, stellenweise aper), Kombinationen aus zweien (Pulver-Sulz, hart-nass, Sulz-Pulver, nass-hart, ...) sowie \"keine Meldung\". Nur wenige Inhalte tragen einen Wert: der Baum beschreibt gemeldete Skigebiete/Pisten, nicht das Wintersportangebot insgesamt -- eine niedrige Trefferzahl ist hier die Regel und kein Filterfehler. Weil derselbe Zustand als Einzelwert UND als Bestandteil mehrerer Kombinationen auftritt, deckt eine Frage nach \"Pulverschnee\" alle Concepts ab, deren Name \"Pulver\" enthält, nicht nur das gleichnamige; diese gehören gemeinsam in EINE classification_alias_id_groups-Gruppe. Die Werte sind tagesaktuelle Meldungen, also volatil."
      "Veranstaltungskategorien":
        description: "Sachkategorie von Veranstaltungen (Event) unter 23 Wurzelästen: Musik, Sport, Theater, Tanz | Ballett, Kunst, Architektur, Ausstellung | Messe, Film | Kino, Literatur, Kurs, Vortrag | Kongress | Symposium | Seminar, Kulturfestival | Festspiele, Fest | Party | Unterhaltung, Kulinarik | Markt | Genuss, Brauchtum | Tradition | Volkskultur, Religiöse Veranstaltungen, Kinder | Jugend | Familie, Senioren, Erholung | Vitalität | Gesundheit | Wellness, Führungen | Fahrten | Touren, Bildungsangebot Tourismus, Veranstaltungsreihe, Sonstige Veranstaltungen. Der kuratierte Kategoriebaum für Events. Besonderheit: viele Namen sind mit \"|\" verkettete Synonymgruppen -- ein Nutzerbegriff steht deshalb oft NICHT am Anfang des Namens (\"Wellness\" steckt in \"Erholung | Vitalität | Gesundheit | Wellness\", \"Markt\" in \"Kulinarik | Markt | Genuss\"). Bei der Suche nach einem Begriff also über den ganzen Namen matchen, nicht über seinen Anfang."
      "ODTA - Schwierigkeitsgrade":
        description: "Schwierigkeit von Touren (Trail), nur drei Werte: Leicht, Mittel, Schwer. Nahezu vollständig belegt und damit der verlässlichste Filter dieses Bereichs. Achtung Dublette: der nicht kuratierte Baum \"Schwierigkeitsgrad (Trail/Tour)\" bildet dieselbe Dimension ab und trägt dieselbe Anzahl Inhalte -- der Vergleich der thing_counts beider Bäume zeigt es. Einer von beiden genügt; beide gleichzeitig als getrennte UND-Gruppen zu filtern grenzt das Ergebnis nicht weiter ein, sondern verkompliziert es nur. \"OutdoorActive - Schwierigkeitsgrad\" existiert ebenfalls, trägt aber keine Inhalte (thing_count 0) und ist wirkungslos."
      "ODTA - Tourenkategorien":
        description: "Art der Tour (Trail) unter acht Wurzelästen: Wandern, Bergsteigen, Radfahren, Winter, Wassersport, Reiten, Gehen und Skaten, Motorisierte Tour. Zweistufig -- die eigentlichen Tourenarten hängen erst unter den Wurzeln, unter \"Bergsteigen\" etwa Bergtour, Alpintour, Hochtour, Klettersteig, Alpinklettern, Eisklettern. Genau hier ist include_subtree gefährlich: ein Elternknoten zieht seinen gesamten Subtree mit, und \"Wanderung\" ist nicht dasselbe wie \"Bergsteigen\", das Klettersteige und Eisklettern mitbringt. Deckt ein Nutzerbegriff nur einen Teil eines Astes ab, die passenden Kindknoten einzeln übergeben statt des Elternknotens."
    scope:
      # Value for the %{endpoint_name} interpolation of the shared tool descriptions on the global
      # mount, which has no endpoint name (see Servers::GlobalServer#tool_description_options).
      global: "»instanzweit« (kein Endpoint-Scope: alle Inhalte, die der aufrufende Nutzer über die API sehen darf -- Facetten und Totals sind entsprechend breit, für eine kuratierte Sicht list_endpoints und den jeweiligen Endpoint-Server nutzen)"
    resources:
      schema_index:
        description: "Liste der Content-Templates (schema.org-Typen), deren Schema über schema_template abrufbar ist -- im Endpoint-Scope nur die dort tatsächlich vorkommenden Templates. Systemvoraussetzung: im Endpoint-Scope ist die Liste aus den Inhalten gezählt (wie list_templates), instanzweit dagegen aus den installierten Template-Definitionen -- dieselbe Liste bedeutet je nach Server also Datenlage oder Installationsstand."
      schema_template:
        description: "Das OpenAPI-Schema eines einzelnen Content-Templates (schema.org-Typ), aus schema_index. Systemvoraussetzung/Abgrenzung wie bei get_schema: erzeugt aus der installierten Template-Definition -- es beschreibt das mögliche Feldinventar des Typs, nicht den Befüllungsgrad im Endpoint."
