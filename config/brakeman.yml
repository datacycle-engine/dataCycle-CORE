---
# Only non-ruby / non-source directories belong here: skip_files hides a file from
# *every* check forever, so new vulnerabilities in it are never reported.
# Individual accepted warnings go into config/brakeman.ignore instead (via
# `bundle exec brakeman -c config/brakeman.yml -I`), each with a `note` saying why
# it is safe — that keeps the rest of the file scanned.
:skip_files:
  - node_modules/
  - cache/
