# The gem ships the whole MCP layer off (see config/configurations/features.yml). The dummy app
# switches it on because it plays the role of the project that wants to run the server here --
# without it the routes are absent and the MCP suites would run against a 404. write_enabled stays
# off, so the suites cover the default an installation gets; McpWriteToolsTest flips it per test.
:mcp:
  :enabled: true
  :mounts:
    :global:
      :enabled: true
    :endpoint:
      :enabled: true

:publication_schedule:
  :enabled: true

:download:
  :enabled: true
  :downloader:
    :content:
      :enabled: true
      :thing:
        :enabled: true
        :serializers:
          :asset: false
          :gpx: true
          :json: false
          :indesign: false
          :xml: false
      :watch_list:
        :enabled: false
        :serializers:
          :asset: false
          :gpx: false
          :json: false
          :indesign: false
          :xml: false
      :stored_filter:
        :enabled: false
        :serializers:
          :asset: false
          :gpx: false
          :json: false
          :indesign: false
          :xml: false
    :archive:
      :zip:
        :enabled: false
        :thing:
          :enabled: false
          # used from downloader.download.content.thing.serializers. can be overruled here.
          # :serializers:
          :mandatory_serializers:
            :license: false
        :watch_list:
          :enabled: false
          # used from downloader.download.content.thing.serializers. can be overruled here.
          # :serializers:
          :mandatory_serializers:
            :license: false
        :stored_filter:
          :enabled: false
          # used from downloader.download.content.thing.serializers. can be overruled here.
          # :serializers:
          :mandatory_serializers:
            :license: false
      :indesign:
        :enabled: false
        :thing:
          :enabled: false
          :serializers:
            :indesign: true
          :mandatory_serializers:
            :asset: true
        :watch_list:
          :enabled: false
          :serializers:
            :indesign: true
          :mandatory_serializers:
            :asset: true
        :stored_filter:
          :enabled: false
          :serializers:
            :indesign: true
          :mandatory_serializers:
            :asset: true
    :dependencies:
      - serialize

:serialize:
  :enabled: true
  :serializers:
    :asset: false
    :license: true
    :gpx: true
    :indesign: false
    :json: false
    :xml: false

:overlay:
  :enabled: true

:container:
  :enabled: true

:duplicate_content:
  :enabled: true

:releasable:
  :enabled: true

:life_cycle:
  :enabled: true
  :attribute_keys:
    - data_pool
  :tree_label: Inhaltspools
  :ordered:
    - Vorschläge
    - Recherche
    - Aktuelle Inhalte
    - Archiv

:reusable_embedded:
  :enabled: true
  :attribute_keys:
    - reusable

:duplicate_embedded:
  :enabled: true

:idea_collection:
  :enabled: true
  :dependencies:
    - life_cycle
    - container
  :template: Recherche
  :life_cycle_stage: Recherche

:duplicate_candidate:
  :enabled: true

:content_lock:
  :enabled: true

:user_api:
  :enabled: true
  :user_params:
    :given_name:
    :family_name:
  :allowed_redirect_hosts:
    - "*.dummy.com"
    - "trusted.example.com"

:sortable:
  :enabled: true

:advanced_filter:
  :external_system: true
  :export_status: true
  :boolean:
    - duplicate_candidates
  :geo_filter:
    :geo_radius: true
    :geo_within_classification:
      - Administrative Einheiten
  :relation_filter:
    :linked_image: image
    :linked_location: content_location
  :related_to: true
  :union_filter_ids: true
  :advanced_attributes:
    # media
    :width:
      :type: numeric
    :height:
      :type: numeric
    :content_size:
      :type: numeric
    :upload_date:
      :type: date
    :mandatory_license:
      :type: boolean
    :duration:
      :type: numeric
    :dc_capacity:
      :type: numeric
      :path: dcls:capacity
    :amperage:
      :type: numeric
    :voltage:
      :type: numeric
      :path: voltage
    :power:
      :type: numeric
      :path: dcPower
    :dc_nominal_capacity:
      :type: numeric
      :path: dcNominalCapacity
    :dcls_active:
      :type: boolean
      :path: dcls:active

:user_registration:
  :enabled: true
  :terms_condition_url: "https://datacycle.info/de/allgemeine-geschaeftsbedingungen/"
  :privacy_policy_url: "https://open.datacycle.cloud/de/datenschutzerklaerung/"

:user_group_permission:
  :enabled: false
  :default_role: "all"
  :abilities:
    test_permission_1:
      actions:
        - set_life_cycle
    test_permission_2:
      actions:
        - merge_duplicates

:preview:
  :enabled: true
  :widgets:
    :list: https://datacycle.info/widgets/list
    :map: hhttps://datacycle.info/widgets/map

:translate:
  :enabled: true
  :allowed: true
  :external_source: "DeeplTranslate"
  :endpoint: "DataCycleCore::Generic::DeeplTranslate::DummyEndpoint"
  :attribute_keys: ["text"]

:auto_translation:
  :enabled: true

:collection_group:
  :enabled: true

:named_version:
  :enabled: true

:image_proxy:
  :enabled: true
  :frontend:
    :enabled: true

:image_editor:
  :enabled: true

:report_generator:
  :enabled: true
  :config:
    :global:
      :downloads_popular:
        :enabled: true
    :content:
      :downloads_content:
        :enabled: true

:aggregate:
  :enabled: true

:locale_inheritance:
  :enabled: true

# [#47879/#47881] dataPixies. The two backend features are plugin gems that data-cycle-core's own
# test environment does not load -- test/dummy/app/models/data_cycle_core/feature/{content_classifier,
# embedding}.rb stand in for them, so :dependencies: resolve and the pixie routes are drawn at boot.
:content_classifier:
  :enabled: true
  :allowed: true

:embedding:
  :enabled: true
  :allowed: true

:classification_pixie:
  :enabled: true
  :allowed: true
  :dependencies:
    - content_classifier

:annotation_pixie:
  :enabled: true
  :allowed: true
  :dependencies:
    - content_classifier
    - embedding

:image_description_pixie:
  :enabled: true
  :allowed: true
  :dependencies:
    - embedding

# the annotationPixie offers its focus point on the detail page, next to this editor's button and
# through its endpoint, so the button only exists where the manual editor exists
:focus_point_editor:
  :enabled: true
