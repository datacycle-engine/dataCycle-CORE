---
- :data:
    :name: Timeseries
    :type: object
    :content_type: entity
    :schema_ancestors:
      - CreativeWork
    :boost: 100.0
    :properties:
      :schema_types:
        :label: SchemaTypes
        :type: classification
        :tree_label: SchemaTypes
        :visible: false
      :id:
        :label: id
        :type: key
      :name:
        :label: Titel
        :type: string
        :storage_location: translated_value
        :search: true
      :series:
        :label: Messdaten
        :type: timeseries
      :series_collapsed:
        :label: Messdaten (redundante Werte entfernt)
        :type: timeseries
        :collapse_redundant_values: true
      :series_first:
        :label: first
        :type: number
        :storage_location: value
        :virtual:
          :module: Utility::Virtual::Timeseries
          :method: first
          :data: series
      :series_last:
        :label: last
        :type: number
        :storage_location: value
        :virtual:
          :module: Utility::Virtual::Timeseries
          :method: last
          :data: series
      :series_min:
        :label: min
        :type: number
        :storage_location: value
        :virtual:
          :module: Utility::Virtual::Timeseries
          :method: min
          :data: series
      :series_max:
        :label: max
        :type: number
        :storage_location: value
        :virtual:
          :module: Utility::Virtual::Timeseries
          :method: max
          :data: series
      :series_count:
        :label: count
        :type: number
        :storage_location: value
        :virtual:
          :module: Utility::Virtual::Timeseries
          :method: count
          :data: series
      :series_sum:
        :label: sum
        :type: number
        :storage_location: value
        :virtual:
          :module: Utility::Virtual::Timeseries
          :method: sum
          :data: series
      :series_avg:
        :label: avg
        :type: number
        :storage_location: value
        :virtual:
          :module: Utility::Virtual::Timeseries
          :method: avg
          :data: series
      :series_collapsed_count:
        :label: count (collapsed)
        :type: number
        :storage_location: value
        :virtual:
          :module: Utility::Virtual::Timeseries
          :method: count
          :data: series_collapsed
      :series_collapsed_sum:
        :label: sum (collapsed)
        :type: number
        :storage_location: value
        :virtual:
          :module: Utility::Virtual::Timeseries
          :method: sum
          :data: series_collapsed
      :series_collapsed_avg:
        :label: avg (collapsed)
        :type: number
        :storage_location: value
        :virtual:
          :module: Utility::Virtual::Timeseries
          :method: avg
          :data: series_collapsed
