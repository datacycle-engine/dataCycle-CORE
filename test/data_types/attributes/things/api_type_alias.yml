---
# A renamed template and the legacy shell that kept its old name, the shape the APIv4 push has to
# resolve: APIv4 publishes Api-Type-Alias-Renamed as "dcls:Api-Type-Alias-Legacy" (the compat gems
# do this wherever a template was renamed), while Api-Type-Alias-Legacy answers to that same name
# as its own. A push naming it can mean either, and resolves to the one its system may write.
- :data:
    :name: Api-Type-Alias-Renamed
    :type: object
    :content_type: entity
    :schema_ancestors:
      - CreativeWork
    :boost: 1.0
    :api:
      :type: dcls:Api-Type-Alias-Legacy
    :features:
      :creatable:
        :allowed: true
    :properties:
      :schema_types:
        :label: SchemaTypes
        :type: classification
        :tree_label: SchemaTypes
        :visible: false
      :id:
        :label: id
        :type: key
      :name:
        :label: Titel
        :type: string
        :storage_location: translated_value

- :data:
    :name: Api-Type-Alias-Legacy
    :type: object
    :content_type: entity
    :schema_ancestors:
      - CreativeWork
    :boost: 1.0
    :features:
      :creatable:
        :allowed: true
    :properties:
      :schema_types:
        :label: SchemaTypes
        :type: classification
        :tree_label: SchemaTypes
        :visible: false
      :id:
        :label: id
        :type: key
      :name:
        :label: Titel
        :type: string
        :storage_location: translated_value

# A template that publishes under a list of names rather than a single one - SkiSlope carries
# ["odta:SkiSlope", "dcls:Piste"] - so the resolution has to read that list entry by entry. Its
# dcls: entry is another template's own name, the shape ProtectedArea and Örtlichkeit have: a
# push naming "Api-Type-Alias-Renamed" means that template, not the one merely published as it.
- :data:
    :name: Api-Type-Alias-Listed
    :type: object
    :content_type: entity
    :schema_ancestors:
      - CreativeWork
    :boost: 1.0
    :api:
      :type:
        - odta:ApiTypeAliasListed
        - dcls:Api-Type-Alias-Renamed
    :features:
      :creatable:
        :allowed: true
    :properties:
      :schema_types:
        :label: SchemaTypes
        :type: classification
        :tree_label: SchemaTypes
        :visible: false
      :id:
        :label: id
        :type: key
      :name:
        :label: Titel
        :type: string
        :storage_location: translated_value
